<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// Resolve theme before stylesheet applies so we don't flash dark→light.
(function () {
    var pref = localStorage.getItem("flowscope:theme") || "system";
    var resolved = pref === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : pref;
    document.documentElement.setAttribute("data-theme", resolved);
})();
</script>
<style>
:root, :root[data-theme="dark"] {
    --bg-0:        #08090b;
    --bg-1:        #0d0f12;
    --bg-2:        #14171c;
    --bg-3:        #1c2026;
    --line:        #232830;
    --line-bright: #2e3441;
    --text:        #d8dde6;
    --text-dim:    #7d8694;
    --text-faint:  #4a5160;
    --accent:      #6cf0c2;   /* phosphor green */
    --accent-2:    #ff7b54;   /* warm amber */
    --accent-3:    #5fa8ff;   /* signal blue */
    --warn:        #f5d36e;
    --danger:      #ff5e7e;
    --chart-ingress-fill: rgba(108,240,194,0.10);
    --chart-egress-fill:  rgba(255,123,84,0.08);
    --body-glow-1: rgba(108,240,194,0.04);
    --body-glow-2: rgba(95,168,255,0.03);
}

:root[data-theme="light"] {
    --bg-0:        #f4f6fa;
    --bg-1:        #ffffff;
    --bg-2:        #eef1f6;
    --bg-3:        #e3e8f0;
    --line:        #d8dde6;
    --line-bright: #b9c1cf;
    --text:        #161b22;
    --text-dim:    #4a5160;
    --text-faint:  #8a93a3;
    --accent:      #009b6d;
    --accent-2:    #c8552b;
    --accent-3:    #2563eb;
    --warn:        #b8870a;
    --danger:      #d63862;
    --chart-ingress-fill: rgba(0,155,109,0.12);
    --chart-egress-fill:  rgba(200,85,43,0.10);
    --body-glow-1: rgba(0,155,109,0.05);
    --body-glow-2: rgba(37,99,235,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
}

body {
    background-image:
        radial-gradient(circle at 20% 0%,   var(--body-glow-1) 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, var(--body-glow-2) 0%, transparent 40%);
}

/* Layout */
.app {
    display: grid;
    grid-template-rows: 56px 1fr 28px;
    height: 100vh;
}

/* Header */
header {
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
    gap: 24px;
}
.brand {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: 0.4; } }

.header-stats {
    display: flex;
    gap: 24px;
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
}
.header-stats span b {
    color: var(--text);
    font-weight: 500;
}

/* Footer / status bar */
footer {
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-top: 1px solid var(--line);
    background: var(--bg-1);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    gap: 24px;
}
footer .ok    { color: var(--accent); }

/* Main area: sidebar + content */
main {
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
}

aside {
    border-right: 1px solid var(--line);
    background: var(--bg-1);
    overflow-y: auto;
    padding: 16px 0;
}
aside h3 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 0 20px;
    margin: 16px 0 8px 0;
}
aside h3:first-child { margin-top: 0; }

.device-row {
    padding: 10px 20px;
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background 80ms ease;
}
.device-row:hover { background: var(--bg-2); }
.device-row.active {
    background: var(--bg-2);
    border-left-color: var(--accent);
}
.device-row .ip {
    font-weight: 500;
    color: var(--text);
}
.device-row .meta {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
}
.device-row .badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 6px;
    border: 1px solid var(--line-bright);
    color: var(--text-dim);
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.device-row .badge.netflow { color: var(--accent-3); border-color: var(--accent-3); }
.device-row .badge.sflow   { color: var(--accent-2); border-color: var(--accent-2); }

.empty-state {
    padding: 20px;
    color: var(--text-faint);
    font-size: 11px;
    line-height: 1.7;
}
.empty-state code {
    color: var(--accent);
    background: var(--bg-2);
    padding: 1px 4px;
    border-radius: 2px;
}

/* Content */
.content {
    overflow-y: auto;
    padding: 20px;
}
.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
}
.tab {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 100ms;
}
.tab:hover  { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Panels */
.panel {
    background: var(--bg-1);
    border: 1px solid var(--line);
    margin-bottom: 16px;
}
.panel-head {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--bg-2);
}
.panel-head .accent {
    color: var(--accent);
    margin-right: 8px;
}
.panel-head .meta {
    margin-left: auto;
    color: var(--text-faint);
    font-size: 10px;
    letter-spacing: 1px;
}
.panel-body { padding: 16px; }

/* Grid for top widgets */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* Tables */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
}
th {
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 10px;
    color: var(--text-faint);
    background: var(--bg-2);
}
tr:hover td { background: var(--bg-2); }
td.num     { text-align: right; font-variant-numeric: tabular-nums; }
td.dim     { color: var(--text-dim); }
td.proto   { color: var(--accent-3); }
td.ingress { color: var(--accent); }
td.egress  { color: var(--accent-2); }

/* Bar element used inside table cells */
.bar-cell {
    position: relative;
    padding: 6px 12px;
}
.bar-cell .bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg,
        color-mix(in srgb, var(--accent) 15%, transparent),
        color-mix(in srgb, var(--accent) 5%,  transparent));
    border-right: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    z-index: 0;
}
.bar-cell .label { position: relative; z-index: 1; }

/* Time series chart */
.timeseries {
    position: relative;
    height: 220px;
}
.ts-legend {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    display: flex; gap: 14px;
}
.ts-legend .swatch {
    display: inline-block; width: 8px; height: 8px;
    margin-right: 6px; vertical-align: middle;
}

/* Interface row */
.iface-card {
    border: 1px solid var(--line);
    background: var(--bg-2);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 70px 1fr 1fr;
    gap: 16px;
    align-items: center;
    cursor: pointer;
    transition: border-color 100ms;
}
.iface-card:hover { border-color: var(--line-bright); }
.iface-card .ifname {
    font-weight: 500;
    font-size: 14px;
    color: var(--text);
}
.iface-card .ifindex {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
}
.iface-card .dir {
    display: flex; flex-direction: column; gap: 2px;
}
.iface-card .dir .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-faint);
}
.iface-card .dir .value {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
}
.iface-card .dir.in  .value { color: var(--accent); }
.iface-card .dir.out .value { color: var(--accent-2); }
.iface-card .dir .sub {
    font-size: 10px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
}

/* Setup overlay (shown when no devices) */
.setup-card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    padding: 24px;
    max-width: 720px;
    margin: 40px auto;
}
.setup-card h2 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
}
.setup-card p { color: var(--text-dim); margin-bottom: 16px; font-size: 12px; }
.setup-card pre {
    background: var(--bg-0);
    border: 1px solid var(--line);
    padding: 14px 16px;
    color: var(--accent);
    font-size: 12px;
    line-height: 1.7;
    overflow-x: auto;
    margin-bottom: 16px;
}
.setup-card pre .c { color: var(--text-faint); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--line-bright); }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

.spinner {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Sortable / filterable table controls */
.table-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
}
.table-controls input.table-filter {
    flex: 1;
    background: var(--bg-0);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 5px 8px;
    outline: none;
}
.table-controls input.table-filter:focus { border-color: var(--accent); }
.table-controls .table-meta {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
}

th.sortable {
    cursor: pointer;
    user-select: none;
}
th.sortable:hover { color: var(--text); }
th.sort-active   { color: var(--accent); }

/* Edit-label icon */
.edit-ico {
    display: inline-block;
    margin-left: 6px;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 0 3px;
    line-height: 1;
}
.edit-ico:hover { color: var(--accent); }

/* Filter chip (active server-side filter, e.g. ifindex) */
.filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    margin-right: 8px;
}
.filter-chip .x {
    cursor: pointer;
    color: var(--text-dim);
    margin-left: 4px;
}
.filter-chip .x:hover { color: var(--danger); }

.device-row .ip .label-text {
    font-weight: 500;
    color: var(--text);
}
.device-row .ip .ip-text {
    color: var(--text-dim);
    font-size: 10px;
    margin-left: 6px;
    font-weight: 400;
}
.device-row .actions {
    float: right;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0 4px;
    font-size: 11px;
}
.device-row .actions:hover { color: var(--accent); }

/* Footer live indicator */
footer .live-ok    { color: var(--accent); }
footer .live-stale { color: var(--danger); }

/* Time-range selector (Overview timeseries panel head) */
.range-switch {
    margin-left: auto;
    display: inline-flex;
    gap: 2px;
}
.range-switch button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-faint);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: color 100ms, background 100ms, border-color 100ms;
}
.range-switch button:hover {
    color: var(--text-dim);
    border-color: var(--line-bright);
}
.range-switch button.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--bg-2);
}

/* Theme switcher (footer, bottom-left) */
.theme-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
}
.theme-switch button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-faint);
    cursor: pointer;
    padding: 2px 5px;
    line-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 100ms, background 100ms, border-color 100ms;
}
.theme-switch button:hover { color: var(--text-dim); }
.theme-switch button.active {
    color: var(--accent);
    border-color: var(--line-bright);
    background: var(--bg-2);
}
.theme-switch svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<div class="app">

    <header>
        <div class="brand">
            <div class="dot"></div>
            FLOWSCOPE
        </div>
        <div class="header-stats">
            <span>NETFLOW <b id="hdr-nf">—</b></span>
            <span>SFLOW <b id="hdr-sf">—</b></span>
            <span>FLOWS <b id="hdr-flows">—</b></span>
            <span>DEVICES <b id="hdr-dev">—</b></span>
            <span>UPTIME <b id="hdr-up">—</b></span>
        </div>
    </header>

    <main>
        <aside>
            <h3>Exporters</h3>
            <div id="device-list">
                <div class="empty-state">
                    No flow exporters detected yet.<br><br>
                    Configure your switch to send to:<br>
                    NetFlow → UDP <code id="empty-nf-port">2055</code><br>
                    sFlow   → UDP <code id="empty-sf-port">6343</code>
                </div>
            </div>

            <h3>Filter</h3>
            <div style="padding:0 20px">
                <button id="clear-filter" style="
                    background:var(--bg-2); border:1px solid var(--line);
                    color:var(--text-dim); padding:6px 10px; font-family:inherit;
                    font-size:11px; cursor:pointer; width:100%;
                    text-transform:uppercase; letter-spacing:1.5px;">
                    Show All Devices
                </button>
            </div>
        </aside>

        <div class="content" id="content">
            <div class="tabs">
                <div class="tab active" data-tab="overview">Overview</div>
                <div class="tab" data-tab="interfaces">Interfaces</div>
                <div class="tab" data-tab="flows">Live Flows</div>
                <div class="tab" data-tab="setup">Setup</div>
            </div>
            <div id="tab-content"></div>
        </div>
    </main>

    <footer>
        <span class="theme-switch" role="group" aria-label="Theme">
            <button data-theme="light" title="Light" aria-label="Light theme">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </button>
            <button data-theme="dark" title="Dark" aria-label="Dark theme">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button data-theme="system" title="System" aria-label="System theme">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
            </button>
        </span>
        <span><span class="ok">●</span> COLLECTOR ONLINE</span>
        <span id="foot-selected">VIEW: ALL DEVICES</span>
        <span id="foot-status" class="live-ok" style="margin-left:auto">● LIVE</span>
        <span id="foot-time">—</span>
    </footer>

</div>

<script>
// ===== State =====
const RANGE_OPTIONS = [
    { label: "3m",  seconds: 180   },
    { label: "15m", seconds: 900   },
    { label: "1h",  seconds: 3600  },
    { label: "6h",  seconds: 21600 },
];
const RANGE_KEY = "flowscope:range";
const ALLOWED_RANGE_SECONDS = RANGE_OPTIONS.map(r => r.seconds);
const savedRange = parseInt(localStorage.getItem(RANGE_KEY) || "0", 10);
const initialRange = ALLOWED_RANGE_SECONDS.includes(savedRange) ? savedRange : 180;

const state = {
    activeTab: "overview",
    selectedExporter: null,
    ifindexFilter: null,        // server-side ifindex filter for flows + timeseries
    timeseriesSeconds: initialRange,
    summary: null,
    devices: [],
    interfaces: [],
    flows: [],
    timeseries: null,
    topTalkers: [],
    topPorts: [],
    protocols: [],
    tableState: {},             // per-table { sort, dir, filter }
    paused: false,              // refresh paused (e.g. while a label is being edited)
    lastUpdate: null,           // ms timestamp of last successful refresh
    lastError:  null,
};

// ===== Utilities =====
function bytesHuman(n) {
    if (n == null || isNaN(n)) return "—";
    if (n < 1024) return n + " B";
    const u = ["KB","MB","GB","TB","PB"];
    let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < u.length-1);
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + " " + u[i];
}
function bitsHuman(n) {
    n = n * 8;
    if (n < 1000) return n.toFixed(0) + " bps";
    const u = ["Kbps","Mbps","Gbps","Tbps"];
    let i = -1; do { n /= 1000; i++; } while (n >= 1000 && i < u.length-1);
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + " " + u[i];
}
function numHuman(n) {
    if (n == null) return "—";
    if (n < 1000) return n.toString();
    const u = ["K","M","B","T"];
    let i = -1; do { n /= 1000; i++; } while (n >= 1000 && i < u.length-1);
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + u[i];
}
function timeAgo(ts) {
    if (!ts) return "—";
    const s = Math.floor(Date.now()/1000 - ts);
    if (s < 2)    return "now";
    if (s < 60)   return s + "s ago";
    if (s < 3600) return Math.floor(s/60) + "m ago";
    if (s < 86400) return Math.floor(s/3600) + "h ago";
    return Math.floor(s/86400) + "d ago";
}
function uptimeHuman(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
}
function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

// ===== API =====
async function api(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return await r.json();
}
async function apiSend(path, method, body) {
    const r = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return await r.json();
}
function buildParams(extra = {}) {
    const p = new URLSearchParams();
    if (state.selectedExporter) p.set("exporter", state.selectedExporter);
    if (state.ifindexFilter != null) p.set("ifindex", state.ifindexFilter);
    for (const [k, v] of Object.entries(extra)) p.set(k, v);
    const s = p.toString();
    return s ? "?" + s : "";
}

// ===== Polling =====
async function refreshAll() {
    if (state.paused) return;
    // Interfaces and devices ignore ifindex; flows + timeseries honor it.
    const exporterOnly = state.selectedExporter
        ? `?exporter=${encodeURIComponent(state.selectedExporter)}`
        : "";
    const flowsParams = buildParams({ limit: 200 });
    const tsParams    = buildParams({ seconds: state.timeseriesSeconds });
    const settled = await Promise.allSettled([
        api("/api/summary"),
        api("/api/devices"),
        api("/api/interfaces" + exporterOnly),
        api("/api/flows/recent" + flowsParams),
        api("/api/timeseries"   + tsParams),
        api("/api/top/talkers"  + (exporterOnly ? exporterOnly + "&limit=15" : "?limit=15")),
        api("/api/top/ports"    + (exporterOnly ? exporterOnly + "&limit=10" : "?limit=10")),
        api("/api/protocols"    + exporterOnly),
    ]);
    const slots = ["summary", "devices", "interfaces", "flows",
                   "timeseries", "topTalkers", "topPorts", "protocols"];
    let anyOk = false, anyErr = null;
    settled.forEach((r, i) => {
        if (r.status === "fulfilled" && r.value != null) {
            state[slots[i]] = r.value;
            anyOk = true;
        } else if (r.status === "rejected") {
            anyErr = r.reason;
        }
    });
    if (anyOk) {
        state.lastUpdate = Date.now();
        state.lastError = null;
    }
    if (anyErr && !anyOk) {
        state.lastError = String(anyErr);
        console.warn("refresh failed:", anyErr);
    }
    preserveFocus(() => render());
}

// Save and restore focus / cursor on a focused .table-filter input across
// re-renders. Without this, auto-refresh kicks the user out of the box mid-type.
function preserveFocus(fn) {
    const active = document.activeElement;
    let restore = null;
    if (active && active.classList && active.classList.contains("table-filter")) {
        const wrap = active.closest(".table-wrap");
        restore = {
            id: wrap && wrap.dataset.table,
            cursor: active.selectionStart,
        };
    }
    fn();
    if (restore && restore.id) {
        const ni = document.querySelector(
            `.table-wrap[data-table="${restore.id}"] .table-filter`);
        if (ni) {
            ni.focus();
            try { ni.setSelectionRange(restore.cursor, restore.cursor); }
            catch (e) { /* ignore */ }
        }
    }
}

// ===== Sortable / filterable table helper =====
// Each column = { key, label, cls?, value?(row), render?(row), sortable? }
// `value(row)` is used for both filter matching and sort comparison so callers
// can sort a "Volume" cell by raw bytes while still rendering it formatted.
function makeTable(id, columns, rows, opts = {}) {
    if (!state.tableState[id]) {
        state.tableState[id] = {
            sort: opts.defaultSort || null,
            dir:  opts.defaultDir  || -1,
            filter: "",
        };
    }
    const ts = state.tableState[id];
    const f  = ts.filter.trim().toLowerCase();
    let visible = rows;
    if (f) {
        visible = rows.filter(r => columns.some(c => {
            const v = c.value ? c.value(r) : r[c.key];
            return String(v == null ? "" : v).toLowerCase().includes(f);
        }));
    }
    if (ts.sort) {
        const col = columns.find(c => c.key === ts.sort);
        if (col) {
            visible = visible.slice().sort((a, b) => {
                const av = col.value ? col.value(a) : a[col.key];
                const bv = col.value ? col.value(b) : b[col.key];
                const aN = (av == null), bN = (bv == null);
                if (aN && bN) return 0;
                if (aN) return 1;
                if (bN) return -1;
                if (typeof av === "number" && typeof bv === "number") {
                    return (av - bv) * ts.dir;
                }
                return String(av).localeCompare(String(bv)) * ts.dir;
            });
        }
    }
    const arrow = key => ts.sort === key ? (ts.dir === 1 ? " ↑" : " ↓") : "";
    return `
        <div class="table-wrap" data-table="${escapeHtml(id)}">
            <div class="table-controls">
                <input class="table-filter" placeholder="filter…"
                       value="${escapeHtml(ts.filter)}">
                <span class="table-meta">${visible.length}${
                    visible.length !== rows.length ? ` / ${rows.length}` : ""
                } rows</span>
            </div>
            <table>
                <thead><tr>
                    ${columns.map(c => {
                        const sortable = c.sortable !== false;
                        const cls = [
                            c.cls || "",
                            sortable ? "sortable" : "",
                            ts.sort === c.key ? "sort-active" : "",
                        ].filter(Boolean).join(" ");
                        return `<th class="${cls}"${sortable ? ` data-col="${escapeHtml(c.key)}"` : ""}>${
                            escapeHtml(c.label)}${sortable ? arrow(c.key) : ""}</th>`;
                    }).join("")}
                </tr></thead>
                <tbody>
                    ${visible.length === 0
                      ? `<tr><td colspan="${columns.length}"
                              style="color:var(--text-faint);text-align:center;padding:24px">
                              ${rows.length === 0 ? "No data yet."
                                                  : "No rows match filter."}
                         </td></tr>`
                      : visible.map(r => `<tr>${columns.map(c =>
                            c.render
                                ? c.render(r)
                                : `<td class="${c.cls || ""}">${
                                       escapeHtml(r[c.key] == null ? "" : r[c.key])
                                   }</td>`
                        ).join("")}</tr>`).join("")
                    }
                </tbody>
            </table>
        </div>
    `;
}

function wireTables() {
    document.querySelectorAll(".table-wrap").forEach(w => {
        const id = w.dataset.table;
        const ts = state.tableState[id];
        if (!ts) return;
        const input = w.querySelector(".table-filter");
        if (input) {
            input.addEventListener("input", () => {
                ts.filter = input.value;
                preserveFocus(() => renderTab());
            });
        }
        w.querySelectorAll("th.sortable").forEach(th => {
            th.addEventListener("click", () => {
                const col = th.dataset.col;
                if (ts.sort === col) ts.dir *= -1;
                else { ts.sort = col; ts.dir = -1; }
                renderTab();
            });
        });
    });
}

// ===== Label editing =====
async function editExporterLabel(ip, current) {
    state.paused = true;
    try {
        const v = window.prompt(
            `Display label for exporter ${ip}\n(blank to clear)`,
            current || "");
        if (v == null) return;  // cancelled
        await apiSend(`/api/exporters/${encodeURIComponent(ip)}/label`,
                      "PUT", { label: v });
    } catch (e) {
        alert("Failed to save label: " + e.message);
    } finally {
        state.paused = false;
        refreshAll();
    }
}

async function editInterfaceLabel(exporter, ifindex, current) {
    state.paused = true;
    try {
        const v = window.prompt(
            `Display label for ${exporter} if${ifindex}\n(blank to clear)`,
            current || "");
        if (v == null) return;
        await apiSend(`/api/interfaces/${encodeURIComponent(exporter)}/${ifindex}/label`,
                      "PUT", { label: v });
    } catch (e) {
        alert("Failed to save label: " + e.message);
    } finally {
        state.paused = false;
        refreshAll();
    }
}

// What to display for an exporter: prefer user label, then reverse-DNS, then IP.
function exporterDisplayName(d) {
    return d.label || d.hostname || d.exporter;
}

// ===== Rendering =====
function render() {
    renderHeader();
    renderSidebar();
    renderTab();
    renderFooter();
}

function renderHeader() {
    const s = state.summary;
    if (!s) return;
    document.getElementById("hdr-nf").textContent    = numHuman(s.netflow_packets);
    document.getElementById("hdr-sf").textContent    = numHuman(s.sflow_packets);
    document.getElementById("hdr-flows").textContent = numHuman(s.flows_recorded);
    document.getElementById("hdr-dev").textContent   = s.device_count;
    document.getElementById("hdr-up").textContent    = uptimeHuman(s.uptime_seconds);
    document.getElementById("empty-nf-port").textContent = s.ports.netflow;
    document.getElementById("empty-sf-port").textContent = s.ports.sflow;
}

function renderFooter() {
    let viewLabel = "VIEW: ALL DEVICES";
    if (state.selectedExporter) {
        const d = state.devices.find(x => x.exporter === state.selectedExporter);
        viewLabel = "VIEW: " + (d ? exporterDisplayName(d) : state.selectedExporter);
    }
    document.getElementById("foot-selected").textContent = viewLabel;
    const stat = document.getElementById("foot-status");
    if (state.lastError && !state.lastUpdate) {
        stat.textContent = "● STALLED";
        stat.className = "live-stale";
    } else if (state.lastUpdate) {
        const age = Math.floor((Date.now() - state.lastUpdate) / 1000);
        const stale = age > 10;
        stat.textContent = stale
            ? `● STALE ${age}s`
            : `● LIVE · ${new Date(state.lastUpdate).toLocaleTimeString()}`;
        stat.className = stale ? "live-stale" : "live-ok";
    } else {
        stat.textContent = "● CONNECTING…";
        stat.className = "";
    }
    document.getElementById("foot-time").textContent =
        new Date().toISOString().replace("T"," ").slice(0,19) + " UTC";
}

function renderSidebar() {
    const list = document.getElementById("device-list");
    if (!state.devices.length) return;
    list.innerHTML = state.devices.map(d => {
        const display = exporterDisplayName(d);
        const showIp = display !== d.exporter;
        return `
        <div class="device-row ${state.selectedExporter === d.exporter ? "active" : ""}"
             data-exporter="${escapeHtml(d.exporter)}">
            <div class="ip">
                <span class="actions" data-edit-exporter="${escapeHtml(d.exporter)}"
                      data-current="${escapeHtml(d.label || "")}"
                      title="Edit label">✎</span>
                <span class="label-text">${escapeHtml(display)}</span>
                ${showIp ? `<span class="ip-text">${escapeHtml(d.exporter)}</span>` : ""}
            </div>
            <div class="meta">
                <span class="badge ${d.type}">${d.type}</span>
                ${d.interface_count} ifs · ${numHuman(d.flow_count)} flows · ${timeAgo(d.last_seen)}
            </div>
        </div>`;
    }).join("");
    list.querySelectorAll(".device-row").forEach(r => {
        r.addEventListener("click", (ev) => {
            // Don't change selection when clicking the edit pencil.
            if (ev.target && ev.target.dataset && ev.target.dataset.editExporter) {
                ev.stopPropagation();
                editExporterLabel(ev.target.dataset.editExporter,
                                  ev.target.dataset.current);
                return;
            }
            const exp = r.dataset.exporter;
            const wasSelected = state.selectedExporter === exp;
            state.selectedExporter = wasSelected ? null : exp;
            // Clear interface filter when changing exporter so we don't end
            // up filtering by an ifindex that belongs to a different exporter.
            state.ifindexFilter = null;
            // Drop view-scoped data so we don't paint the wrong scope while
            // the next fetch is in flight.
            state.flows = [];
            state.timeseries = null;
            state.topTalkers = [];
            state.topPorts   = [];
            state.protocols  = [];
            state.interfaces = [];
            render();      // immediate: highlight, chips, scope label
            refreshAll();  // background: real data
        });
    });
}

document.getElementById("clear-filter").addEventListener("click", () => {
    state.selectedExporter = null;
    state.ifindexFilter = null;
    state.flows = [];
    state.timeseries = null;
    state.topTalkers = [];
    state.topPorts   = [];
    state.protocols  = [];

document.querySelectorAll(".tab").forEach(t => {

    if (state.activeTab === "overview")   { wireOverviewControls(); drawTimeseries(); }

    document.querySelectorAll(".range-switch button").forEach(b => {

            state.timeseriesSeconds = s;
            localStorage.setItem(RANGE_KEY, String(s));

// ----- Overview tab -----
function renderOverview() {
    if (!state.devices.length) {
        return renderSetup();   // bootstrap aid
    }
    // Title and legend reflect what the chart actually plots:
    //   - No ifindex filter: per-second sum of flow bytes (each flow counts once).
    //     There's no meaningful direction so we show a single "VOLUME" series.
    //   - With ifindex filter: split into INGRESS / EGRESS for that interface.
    const ifFilter = state.ifindexFilter != null;
    const scope = state.selectedExporter
        ? (() => {
              const d = state.devices.find(x => x.exporter === state.selectedExporter);
              return d ? exporterDisplayName(d) : state.selectedExporter;
          })()
        : "all exporters";
    const tsHead = ifFilter
        ? `Ingress / Egress · if${escapeHtml(state.ifindexFilter)} · ${escapeHtml(scope)}`
        : `Total Flow Volume · ${escapeHtml(scope)}`;
    const tsLegend = ifFilter
        ? `<span><span class="swatch" style="background:var(--accent)"></span>INGRESS</span>
           <span><span class="swatch" style="background:var(--accent-2)"></span>EGRESS</span>`
        : `<span><span class="swatch" style="background:var(--accent)"></span>VOLUME</span>
           <span style="color:var(--text-faint)">each flow counted once</span>`;
    const rangeButtons = RANGE_OPTIONS.map(r =>
        `<button data-seconds="${r.seconds}"${
            state.timeseriesSeconds === r.seconds ? ' class="active"' : ""
        }>${r.label}</button>`
    ).join("");
    return `
        <div class="grid-3">
            <div class="panel">
                <div class="panel-head">
                    <span class="accent">▸</span> ${tsHead}
                    <span class="range-switch" role="group" aria-label="Time range">${rangeButtons}</span>
                </div>
                <div class="panel-body">
                    <div class="timeseries">
                        <div class="ts-legend">${tsLegend}</div>
                        <canvas id="ts-canvas" width="800" height="220"></canvas>
                    </div>
                </div>
            </div>
            <div class="panel">
                <div class="panel-head"><span class="accent">▸</span> Protocols</div>
                <div class="panel-body" style="padding:0">${renderProtocolTable()}</div>
            </div>
            <div class="panel">
                <div class="panel-head"><span class="accent">▸</span> Top Ports</div>
                <div class="panel-body" style="padding:0">${renderTopPortsTable()}</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-head"><span class="accent">▸</span> Top Talkers (src → dst)</div>
            <div class="panel-body" style="padding:0">${renderTopTalkersTable()}</div>
        </div>

function drawTimeseries() {
    const c = document.getElementById("ts-canvas");
    if (!c) return;
    const ctx = c.getContext("2d");
    // Adapt to actual displayed width
    const cw = c.clientWidth, ch = c.clientHeight;
    if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
    ctx.clearRect(0, 0, cw, ch);
    if (!state.timeseries) return;   // canvas already cleared above

    const css = getComputedStyle(document.documentElement);
    const cssVar = (name) => css.getPropertyValue(name).trim();
    const gridColor    = cssVar("--line");
    const axisColor    = cssVar("--text-faint");
    const ingressColor = cssVar("--accent");
    const egressColor  = cssVar("--accent-2");
    const ingressFill  = cssVar("--chart-ingress-fill");
    const egressFill   = cssVar("--chart-egress-fill");

    const ing = state.timeseries.ingress;
    const eg  = state.timeseries.egress;
    const n   = ing.length;
    const max = Math.max(1, ...ing, ...eg);

    // grid
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
        const y = (ch / 4) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
    }
    // y-axis labels
    ctx.fillStyle = axisColor;
    ctx.font = "10px JetBrains Mono";
    ctx.textAlign = "right";
    ctx.fillText(bytesHuman(max) + "/s",        cw - 4, 12);
    ctx.fillText(bytesHuman(max/2) + "/s",      cw - 4, ch/2 + 4);
    ctx.fillText("0",                            cw - 4, ch - 4);

    function plot(data, color, fillColor) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            const x = (i / (n - 1)) * cw;
            const y = ch - (data[i] / max) * (ch - 16) - 4;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        // fill
        ctx.lineTo(cw, ch); ctx.lineTo(0, ch); ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
        // line
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            const x = (i / (n - 1)) * cw;
            const y = ch - (data[i] / max) * (ch - 16) - 4;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
    plot(ing, ingressColor, ingressFill);
    if (eg.some(v => v > 0)) plot(eg, egressColor, egressFill);
}

              data-exporter="${escapeHtml(r.exporter)}"
              data-ifindex="${r.ifindex}"
              style="color:var(--accent-3);cursor:pointer">view flows ▸</a></td>` },
    ], rows, { defaultSort: "ingress_bytes", defaultDir: -1 });
    return `
        <div class="panel">
            <div class="panel-head">
                <span class="accent">▸</span> Interfaces
                <span class="meta">${state.interfaces.length} interfaces ·
                    ingress + egress per ifIndex (counter samples win when present)</span>
            </div>
            ${tableHtml}
        </div>
    `;
}
function wireInterfaceTable() {
    // "View flows" link applies a server-side ifindex filter and switches tabs.
    document.querySelectorAll(".iface-view").forEach(a => {
        a.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const exp = a.dataset.exporter;
            const idx = parseInt(a.dataset.ifindex, 10);
            state.selectedExporter = exp;
            state.ifindexFilter = idx;
            state.activeTab = "flows";
            // Clear so we don't briefly show the un-filtered flow list.
            state.flows = [];
            document.querySelectorAll(".tab").forEach(t => {
                t.classList.toggle("active", t.dataset.tab === "flows");
            });
            render();      // immediate: tab swap, sidebar selection, chips
            refreshAll();  // background: filtered flow data
        });
    });
    // Pencil = edit label
    document.querySelectorAll('[data-edit-iface]').forEach(el => {
        el.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const [exp, idx] = el.dataset.editIface.split("|");
            editInterfaceLabel(exp, parseInt(idx, 10), el.dataset.current);
        });
    });
}

// ----- Live flows tab -----
function renderFlows() {
    // Active filter chips (server-side filters)
    const chips = [];
    if (state.selectedExporter) {
        const d = state.devices.find(x => x.exporter === state.selectedExporter);
        const lbl = d ? exporterDisplayName(d) : state.selectedExporter;
        chips.push(`<span class="filter-chip">EXPORTER: ${escapeHtml(lbl)}
            <span class="x" data-clear="exporter">×</span></span>`);
    }
    if (state.ifindexFilter != null) {
        chips.push(`<span class="filter-chip">IFINDEX: ${escapeHtml(state.ifindexFilter)}
            <span class="x" data-clear="ifindex">×</span></span>`);
    }

    if (!state.flows.length) {
        return `
        <div class="panel">
            <div class="panel-head">
                <span class="accent">▸</span> Live Flow Records
                <span class="meta">${chips.join("") || "no filters"}</span>
            </div>
            <div class="panel-body" style="color:var(--text-dim)">
                <span class="spinner"></span>
                ${state.ifindexFilter != null
                  ? "No recent flows matched this interface filter. Showing only flows the collector has seen for this ifIndex."
                  : "Awaiting flow records."}
            </div>
        </div>`;
    }

    const rows = state.flows.map(f => ({
        ...f,
        time_local: new Date((f.ts || 0) * 1000).toLocaleTimeString(),
        src: (f.src_ip || "?") + (f.src_port ? ":" + f.src_port : ""),
        dst: (f.dst_ip || "?") + (f.dst_port ? ":" + f.dst_port : ""),
    }));
    const tableHtml = makeTable("flows", [
        { key: "ts", label: "Time",
          render: r => `<td class="dim">${escapeHtml(r.time_local)}</td>` },
        { key: "exporter", label: "Exporter",
          render: r => `<td class="dim">${escapeHtml(r.exporter)}</td>` },
        { key: "src", label: "Src → Dst", value: r => r.src + " → " + r.dst,
          render: r => `<td>
              <span>${escapeHtml(r.src)}</span>
              <span class="dim"> → </span>
              <span>${escapeHtml(r.dst)}</span>
          </td>` },
        { key: "protocol_name", label: "Proto",
          render: r => `<td class="proto">${escapeHtml(r.protocol_name || "")}</td>` },
        { key: "input_if", label: "In if", cls: "num",
          render: r => `<td class="num ingress">${r.input_if ?? ""}</td>` },
        { key: "output_if", label: "Out if", cls: "num",
          render: r => `<td class="num egress">${r.output_if ?? ""}</td>` },
        { key: "bytes", label: "Bytes", cls: "num",
          render: r => `<td class="num">${bytesHuman(r.bytes)}</td>` },
        { key: "packets", label: "Packets", cls: "num",
          render: r => `<td class="num dim">${numHuman(r.packets)}</td>` },
    ], rows, { defaultSort: "ts", defaultDir: -1 });

    return `
        <div class="panel">
            <div class="panel-head">
                <span class="accent">▸</span> Live Flow Records
                <span class="meta">${chips.join("") || `${rows.length} most recent`}</span>
            </div>
            ${tableHtml}
        </div>
    `;
}

function wireFlowsControls() {
    document.querySelectorAll('[data-clear]').forEach(el => {
        el.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const w = el.dataset.clear;
            if (w === "exporter") state.selectedExporter = null;
            if (w === "ifindex")  state.ifindexFilter   = null;
            state.flows = [];
            render();
            refreshAll();
        });
    });
}

// ----- Setup tab -----
function renderSetup() {
    const s = state.summary || { ports: { netflow: 2055, sflow: 6343 } };
    return `
        <div class="setup-card">
            <h2>// Configure your switch</h2>
            <p>Point your device's NetFlow or sFlow exporter at this collector. The
               IP below is the host running FlowScope.</p>

            <h2 style="margin-top:24px">Arista EOS — sFlow</h2>
            <pre><span class="c">! On your Arista switch:</span>
sflow source-interface Management1
sflow destination &lt;collector-ip&gt; ${s.ports.sflow}
sflow polling-interval 10
sflow sample 10000
sflow run</pre>

            <h2>Arista EOS — NetFlow v9</h2>
            <pre><span class="c">! Define a flow record / exporter:</span>
flow tracking hardware
   tracker FLOWSCOPE
      record export on inactive timeout 15
      record export on interval 60
      exporter FLOWSCOPE_EXP
         collector &lt;collector-ip&gt; port ${s.ports.netflow}
         format ipfix version 10
         template interval 5000
   no shutdown
<span class="c">! Enable on each interface you want monitored:</span>
interface Ethernet1
   flow tracker hardware FLOWSCOPE</pre>

            <h2>Cisco IOS — NetFlow v9</h2>
            <pre>flow exporter FLOWSCOPE
 destination &lt;collector-ip&gt;
 transport udp ${s.ports.netflow}
 template data timeout 60
flow monitor FM
 exporter FLOWSCOPE
 record netflow ipv4 original-input
interface GigabitEthernet0/1
 ip flow monitor FM input
 ip flow monitor FM output</pre>

            <h2>Test from any Linux box</h2>
            <pre><span class="c"># Send a synthetic sFlow datagram with hping3 / nc</span>
sudo apt install nfdump softflowd        <span class="c"># optional generators</span></pre>

            <p>Once a device starts sending, it will appear in the left sidebar
               and the Overview tab will start drawing.</p>
        </div>
    `;
}

// ===== Theme switcher =====
const THEME_KEY = "flowscope:theme";
function getThemePref() { return localStorage.getItem(THEME_KEY) || "system"; }
function applyTheme(pref) {
    const resolved = pref === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : pref;
    document.documentElement.setAttribute("data-theme", resolved);
    document.querySelectorAll(".theme-switch button").forEach(b => {
        b.classList.toggle("active", b.dataset.theme === pref);
    });
    if (state.activeTab === "overview") drawTimeseries();
}
document.querySelectorAll(".theme-switch button").forEach(b => {
    b.addEventListener("click", () => {
        localStorage.setItem(THEME_KEY, b.dataset.theme);
        applyTheme(b.dataset.theme);
    });
});
window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
    if (getThemePref() === "system") applyTheme("system");
});
applyTheme(getThemePref());

// ===== Boot =====
refreshAll();
setInterval(refreshAll, 3000);
// Independent 1s heartbeat keeps the live/stale indicator and the
// "X seconds ago" sidebar timestamps current even while polling is paused
// or in flight.
setInterval(() => {
    renderFooter();
    // Cheap re-render of the sidebar's "last seen" relative times.
    if (state.devices.length) renderSidebar();
}, 1000);
window.addEventListener("resize", drawTimeseries);
</script>
</body>
</html>
