// ----- SNMP tab (Phase 4) -----
// Pure inline forms — no popups (memory: feedback_no_browser_popups). Two-step
// confirmation pattern for destructive actions: first click arms the button,
// second click within 5s confirms; click anywhere else or wait for the timeout
// to disarm.

const SNMP_AUTH_PROTOS = ["MD5", "SHA", "SHA224", "SHA256", "SHA384", "SHA512"];
const SNMP_PRIV_PROTOS = ["DES", "3DES", "AES128", "AES192", "AES256"];
const SNMP_SEC_LEVELS  = ["noAuthNoPriv", "authNoPriv", "authPriv"];

function _esc(s) { return escapeHtml(s == null ? "" : String(s)); }

function snmpHealth(exporter) {
    const r = state.snmpStatusByExporter[exporter];
    if (!r) return "none";
    return r.health || "none";
}

function timeAgoTs(ts) {
    if (!ts) return "never";
    const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
    if (s < 60)    return `${s}s ago`;
    if (s < 3600)  return `${Math.floor(s/60)}m ago`;
    if (s < 86400) return `${Math.floor(s/3600)}h ago`;
    return `${Math.floor(s/86400)}d ago`;
}

function renderSnmp() {
    const stat     = state.snmpStatus || {};
    const summary  = stat.summary || { ok: 0, stale: 0, error: 0, total: 0 };
    const cfg      = stat.config  || {};
    const profiles = state.snmpProfiles || [];
    const bindings = state.snmpBindings || [];
    return `
        <div class="snmp-page">
          <div class="snmp-header">
            <span class="snmp-h-title">SNMP</span>
            <span class="snmp-h-stat ok">${summary.ok} ok</span>
            <span class="snmp-h-stat stale">${summary.stale} stale</span>
            <span class="snmp-h-stat err">${summary.error} error</span>
            <span class="meta" style="color:var(--text-dim);font-size:11px;margin-left:auto">
              poll interval default ${cfg.default_interval_s || 60}s
            </span>
            ${cfg.mock ? `<span class="snmp-h-mock">MOCK MODE</span>` : ``}
            ${!cfg.key_configured ? `<span class="snmp-h-warn">FLOWSCOPE_SNMP_KEY not set — v3 profiles cannot be created or unlocked</span>` : ``}
          </div>

          <div class="panel">
            <div class="panel-head"><span class="accent">▸</span> Profiles
              <span class="meta">${profiles.length} defined</span></div>
            <div class="panel-body">
              ${renderSnmpProfileList(profiles)}
              <div class="snmp-section-h" style="margin-top:24px">New profile</div>
              ${renderSnmpProfileForm(null)}
              <div id="snmp-msg-newprofile"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head"><span class="accent">▸</span> Bindings
              <span class="meta">global → folder → device</span></div>
            <div class="panel-body">
              ${renderSnmpBindings(bindings, profiles)}
              <div id="snmp-msg-bindings"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head"><span class="accent">▸</span> Poll status
              <span class="meta">per-device telemetry, persisted across restarts</span></div>
            <div class="panel-body" style="padding:0">
              ${renderSnmpStatusTable(stat.devices || [])}
            </div>
          </div>
        </div>`;
}

function renderSnmpProfileList(profiles) {
    if (!profiles.length) {
        return `<div class="snmp-empty">No profiles yet. Create one below.</div>`;
    }
    return profiles.map(p => {
        const desc = p.version === "2c"
            ? `v2c · community ${p.community ? "set" : "<em>unset</em>"} · port ${p.port}`
            : `v3 · ${_esc(p.v3_username || "?")} · ${_esc(p.v3_security_level || "?")} · auth ${_esc(p.v3_auth_proto || "—")} · priv ${_esc(p.v3_priv_proto || "—")}`;
        return `
        <div class="snmp-row">
          <div>
            <div class="name">${_esc(p.name)}</div>
            <div class="meta">${desc}</div>
          </div>
          <div class="actions">
            <button class="snmp-btn" data-act="snmp-test-profile" data-name="${_esc(p.name)}">Test…</button>
            <button class="snmp-btn" data-act="snmp-edit-profile" data-name="${_esc(p.name)}">Edit</button>
            <button class="snmp-btn danger" data-confirm="del-profile-${_esc(p.name)}" data-act="snmp-delete-profile" data-name="${_esc(p.name)}">Delete</button>
          </div>
        </div>
        <div id="snmp-msg-profile-${_esc(p.name)}"></div>
        <div id="snmp-edit-profile-${_esc(p.name)}" class="snmp-edit-slot"></div>
        <div id="snmp-test-profile-${_esc(p.name)}" class="snmp-test-slot"></div>
        `;
    }).join("");
}

function renderSnmpProfileForm(existing) {
    const e = existing || {};
    const ver = e.version || "2c";
    const idPrefix = existing ? `edit-${_esc(existing.name)}` : "new";
    return `
        <form class="snmp-form" data-form="profile" data-existing="${existing ? _esc(existing.name) : ''}">
          ${existing ? `
            <label>Name</label>
            <input type="text" name="name" value="${_esc(e.name)}" disabled>
          ` : `
            <label>Name</label>
            <input type="text" name="name" placeholder="e.g. core-v3 or edge-public" required>
          `}
          <label>Version</label>
          <select name="version" data-version-select="${idPrefix}">
            <option value="2c"${ver === "2c" ? " selected" : ""}>SNMPv2c</option>
            <option value="3"${ver  === "3"  ? " selected" : ""}>SNMPv3</option>
          </select>

          <div class="span-2 v2c-only" data-show-when="${idPrefix}-2c">
            <label style="width:140px">Community</label>
            <input type="text" name="community" value="${_esc(e.community || '')}" placeholder="readonly" style="flex:1">
          </div>

          <div class="span-2 v3-only" data-show-when="${idPrefix}-3" style="display:none;flex-direction:column;gap:8px;align-items:stretch">
            <div style="display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center">
              <label>Username</label>
              <input type="text" name="v3_username" value="${_esc(e.v3_username || '')}" placeholder="snmpadmin">
              <label>Security level</label>
              <select name="v3_security_level">
                ${SNMP_SEC_LEVELS.map(l => `<option value="${l}"${e.v3_security_level === l ? " selected" : ""}>${l}</option>`).join("")}
              </select>
              <label>Auth protocol</label>
              <select name="v3_auth_proto">
                <option value="">—</option>
                ${SNMP_AUTH_PROTOS.map(p => `<option value="${p}"${e.v3_auth_proto === p ? " selected" : ""}>${p}</option>`).join("")}
              </select>
              <label>Auth passphrase</label>
              <input type="password" name="v3_auth_pass" placeholder="${e.v3_auth_pass === '***set***' ? '(set — leave blank to keep)' : 'min 8 chars'}">
              <label>Priv protocol</label>
              <select name="v3_priv_proto">
                <option value="">—</option>
                ${SNMP_PRIV_PROTOS.map(p => `<option value="${p}"${e.v3_priv_proto === p ? " selected" : ""}>${p}</option>`).join("")}
              </select>
              <label>Priv passphrase</label>
              <input type="password" name="v3_priv_pass" placeholder="${e.v3_priv_pass === '***set***' ? '(set — leave blank to keep)' : 'min 8 chars'}">
              <label>Context</label>
              <input type="text" name="v3_context" value="${_esc(e.v3_context || '')}" placeholder="(optional)">
            </div>
          </div>

          <label>Port</label>
          <input type="number" name="port" value="${_esc(e.port || 161)}" min="1" max="65535">
          <label>Timeout (s)</label>
          <input type="number" name="timeout_s" value="${_esc(e.timeout_s != null ? e.timeout_s : 2)}" step="0.5" min="0.5" max="60">
          <label>Retries</label>
          <input type="number" name="retries" value="${_esc(e.retries != null ? e.retries : 1)}" min="0" max="10">

          <div class="span-2">
            <button type="submit" class="snmp-btn primary">${existing ? "Save changes" : "Create profile"}</button>
            ${existing ? `<button type="button" class="snmp-btn" data-act="snmp-cancel-edit" data-name="${_esc(existing.name)}">Cancel</button>` : ``}
            <span class="hint">v3 passphrases are encrypted at rest with FLOWSCOPE_SNMP_KEY.</span>
          </div>
        </form>`;
}

function renderSnmpBindings(bindings, profiles) {
    const profileOpts = `<option value="">— inherit / no profile —</option>` +
        profiles.map(p => `<option value="${_esc(p.name)}">${_esc(p.name)}</option>`).join("");
    const folderOpts = (state.folders || []).map(f =>
        `<option value="${f.id}">${_esc(f.name)}</option>`).join("");
    const deviceOpts = (state.devices || []).map(d =>
        `<option value="${_esc(d.exporter)}">${_esc(d.exporter)}${d.label ? ` — ${_esc(d.label)}` : ''}</option>`).join("");

    const byScope = { global: [], folder: [], device: [] };
    bindings.forEach(b => byScope[b.scope] && byScope[b.scope].push(b));

    function bindingRow(b) {
        const profile = profiles.find(p => p.name === b.profile);
        const profileLabel = b.profile
            ? (profile ? _esc(b.profile) : `<span class="err">${_esc(b.profile)} (missing)</span>`)
            : `<em>none</em>`;
        let scopeLabel = b.scope;
        if (b.scope === "folder") {
            const f = (state.folders || []).find(x => String(x.id) === b.scope_id);
            scopeLabel = `folder · ${f ? _esc(f.name) : `id=${_esc(b.scope_id)} (deleted)`}`;
        } else if (b.scope === "device") {
            scopeLabel = `device · ${_esc(b.scope_id)}`;
        }
        const interval = b.poll_interval_s != null ? `${b.poll_interval_s}s` : "—";
        const enabled  = b.enabled === 0 ? "off" : (b.enabled === 1 ? "on" : "—");
        return `
        <div class="snmp-row">
          <div>
            <div class="name">${_esc(scopeLabel)}</div>
            <div class="meta">profile: ${profileLabel} · interval: ${interval} · enabled: ${enabled}</div>
          </div>
          <div class="actions">
            <button class="snmp-btn" data-act="snmp-edit-binding"
                    data-scope="${b.scope}" data-scope-id="${_esc(b.scope_id)}">Edit</button>
            <button class="snmp-btn danger" data-confirm="del-binding-${b.scope}-${_esc(b.scope_id)}"
                    data-act="snmp-delete-binding"
                    data-scope="${b.scope}" data-scope-id="${_esc(b.scope_id)}">Delete</button>
          </div>
        </div>
        <div id="snmp-edit-binding-${b.scope}-${_esc(b.scope_id)}" class="snmp-edit-slot"></div>`;
    }

    return `
        <div class="snmp-section-h">Global default</div>
        ${byScope.global.length ? byScope.global.map(bindingRow).join("")
            : `<div class="snmp-empty">No global default. Add one below to enable polling for everything not explicitly bound.</div>`}

        <div class="snmp-section-h">Folder bindings</div>
        ${byScope.folder.length ? byScope.folder.map(bindingRow).join("")
            : `<div class="snmp-empty">No folder bindings.</div>`}

        <div class="snmp-section-h">Device overrides</div>
        ${byScope.device.length ? byScope.device.map(bindingRow).join("")
            : `<div class="snmp-empty">No device overrides.</div>`}

        <div class="snmp-section-h" style="margin-top:24px">Add / replace binding</div>
        <form class="snmp-form" data-form="binding">
          <label>Scope</label>
          <select name="scope" data-binding-scope>
            <option value="global">Global default</option>
            <option value="folder">Folder</option>
            <option value="device">Single device</option>
          </select>
          <label data-show-when="binding-folder" style="display:none">Folder</label>
          <select name="folder_id" data-show-when="binding-folder" style="display:none">${folderOpts}</select>
          <label data-show-when="binding-device" style="display:none">Device</label>
          <select name="device" data-show-when="binding-device" style="display:none">${deviceOpts}</select>
          <label>Profile</label>
          <select name="profile">${profileOpts}</select>
          <label>Poll interval (s)</label>
          <input type="number" name="poll_interval_s" placeholder="(inherit)" min="5" max="86400">
          <label>Enabled</label>
          <select name="enabled">
            <option value="">(inherit)</option>
            <option value="1">on</option>
            <option value="0">off</option>
          </select>
          <div class="span-2">
            <button type="submit" class="snmp-btn primary">Save binding</button>
            <span class="hint">Resolution: device override → folder → global. Each tier overrides whatever earlier tier set.</span>
          </div>
        </form>`;
}

function renderSnmpStatusTable(devices) {
    if (!devices.length) {
        return `<div class="snmp-empty" style="padding:16px">No devices polled yet. Create a profile, bind it, and wait for the next tick.</div>`;
    }
    return `
        <table class="snmp-status-table">
          <thead><tr>
            <th>Exporter</th><th>Health</th><th>Last poll</th><th>Last ok</th>
            <th>Ifs</th><th>Fails</th><th>Last error</th><th></th>
          </tr></thead>
          <tbody>${_renderSnmpStatusRows(devices)}</tbody>
        </table>`;
}

function _renderSnmpStatusRows(devices) {
    return devices.map(r => {
        const cls = r.health === "ok" ? "ok" : (r.health === "error" ? "err" : "stale");
        const errCell = r.last_error ? `<span class="err">${_esc(r.last_error)}</span>` : "—";
        return `
            <tr>
              <td><span class="health ${cls}" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${cls === "ok" ? "var(--accent)" : cls === "err" ? "#e54848" : "var(--accent-2)"};margin-right:6px"></span>${_esc(r.exporter)}</td>
              <td>${_esc(r.health)}</td>
              <td>${timeAgoTs(r.last_poll_ts)}</td>
              <td>${timeAgoTs(r.last_ok_ts)}</td>
              <td>${r.iface_count != null ? r.iface_count : "—"}</td>
              <td>${r.consecutive_failures || 0}</td>
              <td>${errCell}</td>
              <td>
                <button class="snmp-btn" data-act="snmp-poll-now" data-exporter="${_esc(r.exporter)}">Poll now</button>
              </td>
            </tr>`;
    }).join("");
}

// Per-tick in-place updates for the SNMP tab. Touches only the things that
// genuinely change every 3 seconds (status counts, status table rows). Forms,
// profile list, and bindings list are left alone unless explicitly rebuilt
// after a user mutation. This is what stops the tab from flickering and
// stealing focus on every refresh.
function updateSnmpInPlace() {
    const stat    = state.snmpStatus || {};
    const summ    = stat.summary || { ok: 0, stale: 0, error: 0, total: 0 };
    const devices = stat.devices || [];

    // Top status counters
    const okEl = document.querySelector(".snmp-h-stat.ok");
    const stEl = document.querySelector(".snmp-h-stat.stale");
    const erEl = document.querySelector(".snmp-h-stat.err");
    if (okEl) okEl.textContent = `${summ.ok} ok`;
    if (stEl) stEl.textContent = `${summ.stale} stale`;
    if (erEl) erEl.textContent = `${summ.error} error`;

    // Status table body. Only the tbody is replaced, never the surrounding
    // <table> or column headers — that's the bit users were watching twitch.
    const tbody = document.querySelector(".snmp-status-table tbody");
    if (tbody && devices.length) {
        tbody.innerHTML = _renderSnmpStatusRows(devices);
    } else {
        // Transition empty -> populated or populated -> empty: replace just
        // the status panel body, not the whole tab.
        const panels = document.querySelectorAll(".snmp-page > .panel");
        const statusPanel = panels[panels.length - 1];
        if (statusPanel) {
            const body = statusPanel.querySelector(".panel-body");
            if (body && (!tbody || !devices.length)) {
                body.innerHTML = renderSnmpStatusTable(devices);
            }
        }
    }
}

// Force a full re-render of the static SNMP frame. Called after profile or
// binding mutations so the lists reflect what's now in state. No-op when the
// SNMP tab isn't active (the next click into the tab will rebuild fresh
// anyway via state.lastRenderedTab).
function rebuildSnmpStatic() {
    if (state.activeTab !== "snmp") return;
    const root = document.getElementById("tab-content");
    if (!root) return;
    root.innerHTML = renderSnmp();
    wireSnmpControls();
}

// ----- SNMP wiring -----
function _snmpMsg(id, kind, text) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<div class="snmp-msg ${kind}">${_esc(text)}</div>`;
    if (kind === "ok") setTimeout(() => { if (el) el.innerHTML = ""; }, 4000);
}

function _armConfirm(btn, key, onConfirm) {
    if (btn.dataset.armed === "1") {
        clearTimeout(state.snmpConfirmArmed[key]);
        delete state.snmpConfirmArmed[key];
        btn.dataset.armed = "0";
        btn.textContent = btn.dataset.label || "Delete";
        onConfirm();
        return;
    }
    btn.dataset.label = btn.dataset.label || btn.textContent;
    btn.dataset.armed = "1";
    btn.textContent = "click again to confirm";
    state.snmpConfirmArmed[key] = setTimeout(() => {
        btn.dataset.armed = "0";
        btn.textContent = btn.dataset.label || "Delete";
        delete state.snmpConfirmArmed[key];
    }, 5000);
}

function _wireVersionToggle(form, prefix) {
    const sel = form.querySelector('[data-version-select="' + prefix + '"]');
    if (!sel) return;
    function apply() {
        const v = sel.value;
        form.querySelectorAll('[data-show-when="' + prefix + '-2c"]').forEach(el => {
            el.style.display = v === "2c" ? "" : "none";
        });
        form.querySelectorAll('[data-show-when="' + prefix + '-3"]').forEach(el => {
            el.style.display = v === "3" ? "flex" : "none";
        });
    }
    sel.addEventListener("change", apply);
    apply();
}

function _wireBindingScopeToggle(form) {
    const sel = form.querySelector("[data-binding-scope]");
    if (!sel) return;
    function apply() {
        const v = sel.value;
        form.querySelectorAll('[data-show-when="binding-folder"]').forEach(el => {
            el.style.display = v === "folder" ? "" : "none";
        });
        form.querySelectorAll('[data-show-when="binding-device"]').forEach(el => {
            el.style.display = v === "device" ? "" : "none";
        });
    }
    sel.addEventListener("change", apply);
    apply();
}

async function snmpSubmitProfile(form) {
    const existing = form.dataset.existing;
    const fd = new FormData(form);
    const body = {};
    if (!existing) body.name = (fd.get("name") || "").trim();
    body.version           = fd.get("version");
    body.community         = (fd.get("community") || "").trim() || null;
    body.v3_username       = (fd.get("v3_username") || "").trim() || null;
    body.v3_security_level = fd.get("v3_security_level") || null;
    body.v3_auth_proto     = fd.get("v3_auth_proto") || null;
    body.v3_priv_proto     = fd.get("v3_priv_proto") || null;
    body.v3_context        = (fd.get("v3_context") || "").trim() || null;
    body.port              = parseInt(fd.get("port") || "161", 10);
    body.timeout_s         = parseFloat(fd.get("timeout_s") || "2");
    body.retries           = parseInt(fd.get("retries") || "1", 10);
    // Passphrases: only send if user typed something. Empty leaves stored value alone on PATCH.
    const auth = fd.get("v3_auth_pass");
    const priv = fd.get("v3_priv_pass");
    if (auth) body.v3_auth_pass = auth;
    if (priv) body.v3_priv_pass = priv;
    const msgId = existing ? `snmp-msg-profile-${existing}` : "snmp-msg-newprofile";
    try {
        if (existing) {
            await apiSend(`/api/snmp/profiles/${encodeURIComponent(existing)}`, "PATCH", body);
        } else {
            await apiSend("/api/snmp/profiles", "POST", body);
        }
        await refreshAll();
        // Static frame (profile list, forms) needs a rebuild now that the
        // underlying data changed. The msg div gets recreated; we write to
        // it after the rebuild so the success toast shows on the fresh DOM.
        rebuildSnmpStatic();
        _snmpMsg(msgId, "ok", existing ? "Profile saved." : "Profile created.");
    } catch (e) {
        _snmpMsg(msgId, "err", e.message);
    }
}

async function snmpDeleteProfile(name) {
    try {
        await apiSend(`/api/snmp/profiles/${encodeURIComponent(name)}`, "DELETE");
        await refreshAll();
        rebuildSnmpStatic();
    } catch (e) {
        _snmpMsg(`snmp-msg-profile-${name}`, "err", e.message);
    }
}

async function snmpTestProfile(name, slot) {
    slot.innerHTML = `<div class="snmp-msg">Testing...</div>`;
    try {
        // Default to the first known device for convenience; user can override.
        const dev = (state.devices && state.devices[0] && state.devices[0].exporter) || "127.0.0.1";
        const r = await apiSend(`/api/snmp/profiles/${encodeURIComponent(name)}/test`, "POST",
                                { exporter: dev });
        if (r.ok) {
            const ifs = r.ifaces || [];
            slot.innerHTML = `<div class="snmp-msg ok">Walk OK against ${_esc(r.exporter)} — ${ifs.length} ifaces. ${
                ifs.slice(0, 3).map(i => `<code>${i.ifindex}=${_esc(i.name)}</code>`).join(" ")
            }${ifs.length > 3 ? " ..." : ""}</div>`;
        } else {
            slot.innerHTML = `<div class="snmp-msg err">${_esc(r.error || "test failed")}</div>`;
        }
    } catch (e) {
        slot.innerHTML = `<div class="snmp-msg err">${_esc(e.message)}</div>`;
    }
}

async function snmpSubmitBinding(form) {
    const fd = new FormData(form);
    const scope = fd.get("scope");
    let scope_id = "";
    if (scope === "folder") scope_id = String(fd.get("folder_id") || "");
    else if (scope === "device") scope_id = String(fd.get("device") || "");
    if (scope === "folder" && !scope_id) {
        _snmpMsg("snmp-msg-bindings", "err", "Pick a folder.");
        return;
    }
    if (scope === "device" && !scope_id) {
        _snmpMsg("snmp-msg-bindings", "err", "Pick a device.");
        return;
    }
    const body = {};
    const profile = fd.get("profile");
    body.profile = profile || null;
    const interval = fd.get("poll_interval_s");
    if (interval) body.poll_interval_s = parseInt(interval, 10);
    const enabled = fd.get("enabled");
    if (enabled === "1") body.enabled = true;
    else if (enabled === "0") body.enabled = false;
    let url;
    if (scope === "global")      url = "/api/snmp/bindings/global";
    else if (scope === "folder") url = `/api/snmp/bindings/folder/${encodeURIComponent(scope_id)}`;
    else                          url = `/api/snmp/bindings/device/${encodeURIComponent(scope_id)}`;
    try {
        await apiSend(url, "PUT", body);
        await refreshAll();
        rebuildSnmpStatic();
        _snmpMsg("snmp-msg-bindings", "ok", "Binding saved.");
    } catch (e) {
        _snmpMsg("snmp-msg-bindings", "err", e.message);
    }
}

async function snmpDeleteBinding(scope, scope_id) {
    let url;
    if (scope === "global")      url = "/api/snmp/bindings/global";
    else if (scope === "folder") url = `/api/snmp/bindings/folder/${encodeURIComponent(scope_id)}`;
    else                          url = `/api/snmp/bindings/device/${encodeURIComponent(scope_id)}`;
    try {
        await apiSend(url, "DELETE");
        await refreshAll();
        rebuildSnmpStatic();
    } catch (e) {
        _snmpMsg("snmp-msg-bindings", "err", e.message);
    }
}

async function snmpPollNow(exporter) {
    try {
        const r = await apiSend(`/api/snmp/poll/${encodeURIComponent(exporter)}`, "POST");
        if (!r.ok) {
            // Render error inline. The status row will refresh on next tick anyway.
            console.warn("manual poll failed:", r.error);
        }
        await refreshAll();
    } catch (e) {
        console.warn("manual poll error:", e.message);
    }
}

function wireSnmpControls() {
    const root = document.getElementById("tab-content");
    if (!root) return;

    // Version toggle on the new-profile form. Forms are fresh after every
    // static rebuild, so attaching submit handlers here is safe (no stale
    // listeners on torn-down nodes).
    root.querySelectorAll('form[data-form="profile"]').forEach(f => {
        const prefix = f.dataset.existing ? `edit-${f.dataset.existing}` : "new";
        _wireVersionToggle(f, prefix);
        f.addEventListener("submit", (ev) => { ev.preventDefault(); snmpSubmitProfile(f); });
    });

    // Binding form.
    root.querySelectorAll('form[data-form="binding"]').forEach(f => {
        _wireBindingScopeToggle(f);
        f.addEventListener("submit", (ev) => { ev.preventDefault(); snmpSubmitBinding(f); });
    });

    // Click delegation: attach exactly once. tab-content's innerHTML can be
    // replaced any number of times but the element itself persists, so a
    // single delegated listener handles every rebuild.
    if (root.dataset.snmpClickAttached === "1") return;
    root.dataset.snmpClickAttached = "1";
    root.addEventListener("click", (ev) => {
        const t = ev.target.closest("[data-act]");
        if (!t) return;
        const act = t.dataset.act;

        if (act === "snmp-delete-profile") {
            _armConfirm(t, t.dataset.confirm, () => snmpDeleteProfile(t.dataset.name));
            return;
        }
        if (act === "snmp-edit-profile") {
            const slot = document.getElementById(`snmp-edit-profile-${t.dataset.name}`);
            if (!slot) return;
            if (slot.innerHTML) { slot.innerHTML = ""; return; }   // toggle
            const profile = (state.snmpProfiles || []).find(p => p.name === t.dataset.name);
            if (!profile) return;
            slot.innerHTML = renderSnmpProfileForm(profile);
            const newForm = slot.querySelector('form[data-form="profile"]');
            if (newForm) {
                const prefix = `edit-${profile.name}`;
                _wireVersionToggle(newForm, prefix);
                newForm.addEventListener("submit", (ev) => { ev.preventDefault(); snmpSubmitProfile(newForm); });
            }
            return;
        }
        if (act === "snmp-cancel-edit") {
            const slot = document.getElementById(`snmp-edit-profile-${t.dataset.name}`);
            if (slot) slot.innerHTML = "";
            return;
        }
        if (act === "snmp-test-profile") {
            const slot = document.getElementById(`snmp-test-profile-${t.dataset.name}`);
            if (!slot) return;
            snmpTestProfile(t.dataset.name, slot);
            return;
        }
        if (act === "snmp-delete-binding") {
            _armConfirm(t, t.dataset.confirm,
                () => snmpDeleteBinding(t.dataset.scope, t.dataset.scopeId));
            return;
        }
        if (act === "snmp-edit-binding") {
            // Quick path: prefill the bottom form. Saves us building a second form.
            const form = root.querySelector('form[data-form="binding"]');
            if (!form) return;
            const b = (state.snmpBindings || []).find(x =>
                x.scope === t.dataset.scope && x.scope_id === t.dataset.scopeId);
            if (!b) return;
            form.elements["scope"].value = b.scope;
            _wireBindingScopeToggle(form);
            if (b.scope === "folder") form.elements["folder_id"].value = b.scope_id;
            if (b.scope === "device") form.elements["device"].value = b.scope_id;
            form.elements["profile"].value = b.profile || "";
            form.elements["poll_interval_s"].value = b.poll_interval_s != null ? b.poll_interval_s : "";
            form.elements["enabled"].value = b.enabled == null ? "" : String(b.enabled);
            form.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
        }
        if (act === "snmp-poll-now") {
            snmpPollNow(t.dataset.exporter);
            return;
        }
    });
}

// ===== Theme switcher =====
const THEME_KEY = "flowscope:theme";
function getThemePref() { return localStorage.getItem(THEME_KEY) || "system"; }
function applyTheme(pref) {
    const resolved = pref === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : pref;
    document.documentElement.setAttribute("data-theme", resolved);
    document.querySelectorAll(".theme-switch button").forEach(b => {
        b.classList.toggle("active", b.dataset.theme === pref);
    });
    if (state.activeTab === "overview") drawTimeseries();
}
document.querySelectorAll(".theme-switch button").forEach(b => {
    b.addEventListener("click", () => {
        localStorage.setItem(THEME_KEY, b.dataset.theme);
        applyTheme(b.dataset.theme);
    });
});
window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
    if (getThemePref() === "system") applyTheme("system");
});
applyTheme(getThemePref());

// Pause auto-refresh while any SNMP form has focus. Without this, the 3-second
// refresh re-renders the tab content mid-keystroke and the user's input gets
// blown away. Mirrors the state.paused pattern used by modals + label edits.
// Delegated at document level so re-renders never leave a stale listener
// attached to a destroyed element.
document.addEventListener("focusin", (ev) => {
    if (ev.target && ev.target.closest && ev.target.closest(".snmp-form")) {
        state.paused = true;
    }
});
document.addEventListener("focusout", (ev) => {
    if (!ev.target || !ev.target.closest || !ev.target.closest(".snmp-form")) return;
    // Don't unpause if focus is moving to another control inside the same form.
    const next = ev.relatedTarget;
    if (next && next.closest && next.closest(".snmp-form")) return;
    state.paused = false;
});

// ===== Boot =====
bootstrapFolders();
refreshAll();
setInterval(autoRefresh, REFRESH_INTERVAL_MS);
// Independent 1s heartbeat keeps time-derived UI current — "X seconds ago"
// sidebar timestamps, the live/stale footer indicator, the refresh-countdown
// chip in the sidebar header, and the per-device decommission marker (which
// can cross the 5-minute threshold without any new data arriving). Doing
// this in-place prevents the sidebar from twitching once a second.
setInterval(() => {
    renderFooter();
    updateRefreshCountdown();
    const byIp = {};
    (state.devices || []).forEach(d => { byIp[d.exporter] = d; });
    document.querySelectorAll("#device-list .device-row").forEach(row => {
        const d = byIp[row.dataset.exporter];
        if (!d) return;
        // Time-ago text
        row.querySelectorAll(".time-ago").forEach(el => {
            const ts = parseFloat(el.dataset.lastSeen);
            if (!isNaN(ts)) {
                const next = timeAgo(ts);
                if (el.textContent !== next) el.textContent = next;
            }
        });
        // Decommission marker — purely time-based, so the second-tick is
        // where we catch the boundary crossing.
        const stale = isDecommissioned(d);
        if (stale !== row.classList.contains("decommissioned")) {
            row.classList.toggle("decommissioned", stale);
            const ip = row.querySelector(".ip");
            if (ip) {
                let decom = ip.querySelector(".decom");
                if (stale && !decom) {
                    decom = document.createElement("span");
                    decom.className = "decom";
                    decom.title = "No flows in 5+ minutes — possibly decommissioned";
                    decom.textContent = "✕";
                    ip.insertBefore(decom, ip.firstChild);
                } else if (!stale && decom) {
                    decom.remove();
                }
            }
        }
    });
}, 1000);

function updateRefreshCountdown() {
    const el = document.getElementById("refresh-countdown");
    if (!el) return;
    if (state.paused) { el.textContent = "PAUSED"; return; }
    if (!state.nextRefreshAt) { el.textContent = ""; return; }
    const remaining = Math.max(0, Math.ceil((state.nextRefreshAt - Date.now()) / 1000));
    el.textContent = remaining > 0 ? `↻ ${remaining}s` : "↻ now";
}
window.addEventListener("resize", drawTimeseries);
</script>
