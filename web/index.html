<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// Resolve theme before stylesheet applies so we don't flash dark→light.
(function () {
    var pref = localStorage.getItem("flowscope:theme") || "system";
    var resolved = pref === "system"
        ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
        : pref;
    document.documentElement.setAttribute("data-theme", resolved);
})();
</script>
<style>
:root, :root[data-theme="dark"] {
    --bg-0:        #08090b;
    --bg-1:        #0d0f12;
    --bg-2:        #14171c;
    --bg-3:        #1c2026;
    --line:        #232830;
    --line-bright: #2e3441;
    --text:        #d8dde6;
    --text-dim:    #7d8694;
    --text-faint:  #4a5160;
    --accent:      #6cf0c2;   /* phosphor green */
    --accent-2:    #ff7b54;   /* warm amber */
    --accent-3:    #5fa8ff;   /* signal blue */
    --warn:        #f5d36e;
    --danger:      #ff5e7e;
    --chart-ingress-fill: rgba(108,240,194,0.10);
    --chart-egress-fill:  rgba(255,123,84,0.08);
    --body-glow-1: rgba(108,240,194,0.04);
    --body-glow-2: rgba(95,168,255,0.03);
}

:root[data-theme="light"] {
    --bg-0:        #f4f6fa;
    --bg-1:        #ffffff;
    --bg-2:        #eef1f6;
    --bg-3:        #e3e8f0;
    --line:        #d8dde6;
    --line-bright: #b9c1cf;
    --text:        #161b22;
    --text-dim:    #4a5160;
    --text-faint:  #8a93a3;
    --accent:      #009b6d;
    --accent-2:    #c8552b;
    --accent-3:    #2563eb;
    --warn:        #b8870a;
    --danger:      #d63862;
    --chart-ingress-fill: rgba(0,155,109,0.12);
    --chart-egress-fill:  rgba(200,85,43,0.10);
    --body-glow-1: rgba(0,155,109,0.05);
    --body-glow-2: rgba(37,99,235,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
}

body {
    background-image:
        radial-gradient(circle at 20% 0%,   var(--body-glow-1) 0%, transparent 40%),
        radial-gradient(circle at 90% 100%, var(--body-glow-2) 0%, transparent 40%);
}

/* Layout */
.app {
    display: grid;
    grid-template-rows: 56px 1fr 28px;
    height: 100vh;
}

/* Header */
header {
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
    gap: 24px;
}
.brand {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
}
@keyframes pulse { 50% { opacity: 0.4; } }

.header-stats {
    display: flex;
    gap: 24px;
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
}
.header-stats span b {
    color: var(--text);
    font-weight: 500;
}

/* Footer / status bar */
footer {
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-top: 1px solid var(--line);
    background: var(--bg-1);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    gap: 24px;
}
footer .ok    { color: var(--accent); }

/* Main area: sidebar + content */
main {
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
}

aside {
    border-right: 1px solid var(--line);
    background: var(--bg-1);
    overflow-y: auto;
    padding: 16px 0;
}
aside h3 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 500;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 0 20px;
    margin: 16px 0 8px 0;
}
aside h3:first-child { margin-top: 0; }

.device-row {
    padding: 10px 20px;
    border-left: 2px solid transparent;
    cursor: pointer;
    transition: background 80ms ease;
}
.device-row:hover { background: var(--bg-2); }
.device-row.active {
    background: var(--bg-2);
    border-left-color: var(--accent);
}
.device-row .ip {
    font-weight: 500;
    color: var(--text);
}
.device-row .meta {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.device-row .badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 6px;
    border: 1px solid var(--line-bright);
    color: var(--text-dim);
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.device-row .badge.netflow { color: var(--accent-3); border-color: var(--accent-3); }
.device-row .badge.sflow   { color: var(--accent-2); border-color: var(--accent-2); }

.empty-state {
    padding: 20px;
    color: var(--text-faint);
    font-size: 11px;
    line-height: 1.7;
}
.empty-state code {
    color: var(--accent);
    background: var(--bg-2);
    padding: 1px 4px;
    border-radius: 2px;
}

/* Content */
.content {
    overflow-y: auto;
    padding: 20px;
}
.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
}
.tab {
    padding: 8px 16px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 100ms;
}
.tab:hover  { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Panels */
.panel {
    background: var(--bg-1);
    border: 1px solid var(--line);
    margin-bottom: 16px;
}
.panel-head {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--bg-2);
}
.panel-head .accent {
    color: var(--accent);
    margin-right: 8px;
}
.panel-head .meta {
    margin-left: auto;
    color: var(--text-faint);
    font-size: 10px;
    letter-spacing: 1px;
}
.panel-body { padding: 16px; }

/* Grid for top widgets */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* Tables */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
}
th {
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 10px;
    color: var(--text-faint);
    background: var(--bg-2);
}
tr:hover td { background: var(--bg-2); }
td.num     { text-align: right; font-variant-numeric: tabular-nums; }
td.dim     { color: var(--text-dim); }
td.proto   { color: var(--accent-3); }
td.ingress { color: var(--accent); }
td.egress  { color: var(--accent-2); }

/* Bar element used inside table cells */
.bar-cell {
    position: relative;
    padding: 6px 12px;
}
.bar-cell .bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg,
        color-mix(in srgb, var(--accent) 15%, transparent),
        color-mix(in srgb, var(--accent) 5%,  transparent));
    border-right: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    z-index: 0;
}
.bar-cell .label { position: relative; z-index: 1; }

/* Time series chart */
.timeseries {
    position: relative;
    height: 220px;
}
.ts-legend {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    display: flex; gap: 14px;
}
.ts-legend .swatch {
    display: inline-block; width: 8px; height: 8px;
    margin-right: 6px; vertical-align: middle;
}

/* Interface row */
.iface-card {
    border: 1px solid var(--line);
    background: var(--bg-2);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 70px 1fr 1fr;
    gap: 16px;
    align-items: center;
    cursor: pointer;
    transition: border-color 100ms;
}
.iface-card:hover { border-color: var(--line-bright); }
.iface-card .ifname {
    font-weight: 500;
    font-size: 14px;
    color: var(--text);
}
.iface-card .ifindex {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
}
.iface-card .dir {
    display: flex; flex-direction: column; gap: 2px;
}
.iface-card .dir .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-faint);
}
.iface-card .dir .value {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
}
.iface-card .dir.in  .value { color: var(--accent); }
.iface-card .dir.out .value { color: var(--accent-2); }
.iface-card .dir .sub {
    font-size: 10px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
}

/* Setup overlay (shown when no devices) */
.setup-card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    padding: 24px;
    max-width: 720px;
    margin: 40px auto;
}
.setup-card h2 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
}
.setup-card p { color: var(--text-dim); margin-bottom: 16px; font-size: 12px; }
.setup-card pre {
    background: var(--bg-0);
    border: 1px solid var(--line);
    padding: 14px 16px;
    color: var(--accent);
    font-size: 12px;
    line-height: 1.7;
    overflow-x: auto;
    margin-bottom: 16px;
}
.setup-card pre .c { color: var(--text-faint); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--line-bright); }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

.spinner {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* Sortable / filterable table controls */
.table-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
}
.table-controls input.table-filter {
    flex: 1;
    background: var(--bg-0);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    padding: 5px 8px;
    outline: none;
}
.table-controls input.table-filter:focus { border-color: var(--accent); }
.table-controls .table-meta {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
}

th.sortable {
    cursor: pointer;
    user-select: none;
}
th.sortable:hover { color: var(--text); }
th.sort-active   { color: var(--accent); }

/* Edit-label icon */
.edit-ico {
    display: inline-block;
    margin-left: 6px;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 0 3px;
    line-height: 1;
}
.edit-ico:hover { color: var(--accent); }

/* Filter chip (active server-side filter, e.g. ifindex) */
.filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    margin-right: 8px;
}
.filter-chip .x {
    cursor: pointer;
    color: var(--text-dim);
    margin-left: 4px;
}
.filter-chip .x:hover { color: var(--danger); }

.device-row .ip .label-text {
    font-weight: 500;
    color: var(--text);
}
.device-row .ip .ip-text {
    color: var(--text-dim);
    font-size: 10px;
    margin-left: 6px;
    font-weight: 400;
}
.device-row .actions {
    float: right;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0 4px;
    font-size: 11px;
}
.device-row .actions:hover { color: var(--accent); }

/* Endpoint cell: hostname over dim IP, used in Top Talkers + Live Flows */
.endpoint .host { display: block; color: var(--text); }
.endpoint .ip   { display: block; color: var(--text-dim); font-size: 10px; }

/* Footer live indicator */
footer .live-ok    { color: var(--accent); }
footer .live-stale { color: var(--danger); }

/* Folder system (sidebar grouping) */
.folder { border-bottom: 1px solid var(--line); }
.folder-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    background: var(--bg-2);
    cursor: pointer;
    user-select: none;
    font-family: "Space Grotesk", sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.folder-header:hover { background: var(--bg-3); }
.folder-header .chev {
    color: var(--text-faint);
    width: 10px;
    text-align: center;
    font-size: 10px;
}
.folder-header .name {
    flex: 1;
    color: var(--text);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.folder-header .count {
    color: var(--text-faint);
    font-size: 10px;
    font-weight: 400;
    padding: 0 4px;
}
.folder-header .ico {
    color: var(--text-faint);
    cursor: pointer;
    padding: 0 4px;
    font-size: 11px;
    line-height: 1;
}
.folder-header .ico:hover     { color: var(--accent); }
.folder-header .ico.del:hover { color: var(--danger); }

.folder-children .device-row { padding-left: 32px; }
.folder-empty {
    padding: 8px 32px;
    font-size: 10px;
    color: var(--text-faint);
    font-style: italic;
}

.add-folder-btn {
    display: block;
    background: transparent;
    border: 1px dashed var(--line-bright);
    color: var(--text-dim);
    width: calc(100% - 40px);
    margin: 12px 20px 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: color 100ms, border-color 100ms;
}
.add-folder-btn:hover { border-color: var(--accent); color: var(--accent); }

.device-row .actions.move { margin-right: 2px; }

/* Time-range selector (Overview timeseries panel head) */
.range-switch {
    margin-left: auto;
    display: inline-flex;
    gap: 2px;
}
.range-switch button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-faint);
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 2px 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: color 100ms, background 100ms, border-color 100ms;
}
.range-switch button:hover {
    color: var(--text-dim);
    border-color: var(--line-bright);
}
.range-switch button.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--bg-2);
}

/* Theme switcher (footer, bottom-left) */
.theme-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
}
.theme-switch button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-faint);
    cursor: pointer;
    padding: 2px 5px;
    line-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 100ms, background 100ms, border-color 100ms;
}
.theme-switch button:hover { color: var(--text-dim); }
.theme-switch button.active {
    color: var(--accent);
    border-color: var(--line-bright);
    background: var(--bg-2);
}
.theme-switch svg { width: 13px; height: 13px; }

/* In-app modal (replaces window.prompt / window.confirm / alert) */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(2px);
}
.modal {
    background: var(--bg-1);
    border: 1px solid var(--line-bright);
    min-width: 380px;
    max-width: min(560px, 92vw);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
}
.modal-head {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
    font-family: "Space Grotesk", sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--text);
    font-weight: 500;
}
.modal-body {
    padding: 16px 18px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.6;
}
.modal-body .body-text { white-space: pre-wrap; }
.modal-input {
    width: 100%;
    background: var(--bg-0);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    margin-top: 12px;
    outline: none;
}
.modal-input:focus { border-color: var(--accent); }
.modal-choices {
    display: flex; flex-direction: column; gap: 4px;
    margin-top: 12px;
}
.modal-choice {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 8px 12px;
    text-align: left;
    cursor: pointer;
    transition: border-color 100ms, background 100ms, color 100ms;
}
.modal-choice:hover {
    border-color: var(--accent);
    color: var(--accent);
}
.modal-choice.muted { color: var(--text-dim); }
.modal-foot {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    background: var(--bg-2);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}
.modal-foot button {
    background: transparent;
    border: 1px solid var(--line-bright);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 6px 14px;
    cursor: pointer;
    transition: color 100ms, border-color 100ms, background 100ms;
}
.modal-foot button:hover {
    color: var(--text);
    border-color: var(--text-dim);
}
.modal-foot button.primary {
    color: var(--accent);
    border-color: var(--accent);
}
.modal-foot button.primary:hover {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
}
.modal-foot button.danger {
    color: var(--danger);
    border-color: var(--danger);
}
.modal-foot button.danger:hover {
    background: color-mix(in srgb, var(--danger) 15%, transparent);
}

/* ===== Phase 4: SNMP page ===== */
.snmp-chip {
    display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 10px;
    border-radius: 8px; background: var(--bg-2); color: var(--text-dim);
}
.snmp-chip.health-ok    { color: var(--accent);   border: 1px solid var(--accent); }
.snmp-chip.health-stale { color: var(--accent-2); border: 1px solid var(--accent-2); }
.snmp-chip.health-error { color: #e54848;          border: 1px solid #e54848; }
.snmp-chip.empty { display: none; }

.snmp-page { display: flex; flex-direction: column; gap: 16px; }
.snmp-header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--bg-2);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
}
.snmp-header .snmp-h-title { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; color: var(--text-dim); }
.snmp-header .snmp-h-stat { font-size: 12px; padding: 2px 8px; border-radius: 3px; }
.snmp-header .snmp-h-stat.ok    { color: var(--accent);   background: rgba(108,240,194,0.08); }
.snmp-header .snmp-h-stat.stale { color: var(--accent-2); background: rgba(255,123,84,0.08); }
.snmp-header .snmp-h-stat.err   { color: #e54848;          background: rgba(229,72,72,0.08); }
.snmp-header .snmp-h-mock { color: var(--accent-3); font-size: 11px; padding: 2px 8px; border: 1px dashed var(--accent-3); border-radius: 3px; }
.snmp-header .snmp-h-warn { color: var(--accent-2); font-size: 11px; padding: 2px 8px; border: 1px solid var(--accent-2); border-radius: 3px; }

/* Form rows used inside SNMP panels — inline, no popups. */
.snmp-form { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; align-items: center; padding: 12px 0; }
.snmp-form > label { color: var(--text-dim); font-size: 12px; }
.snmp-form > input, .snmp-form > select, .snmp-form > textarea {
    background: var(--bg-1); border: 1px solid var(--line); color: inherit;
    padding: 6px 8px; font-family: inherit; font-size: 13px;
}
.snmp-form > .span-2 { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.snmp-form .hint { color: var(--text-dim); font-size: 11px; font-style: italic; }
.snmp-form input:focus, .snmp-form select:focus { outline: 1px solid var(--accent); }

/* Buttons. Two-step delete: data-armed flips text + color. */
.snmp-btn {
    background: var(--bg-2); color: inherit;
    border: 1px solid var(--line); padding: 5px 10px;
    font-family: inherit; font-size: 12px; cursor: pointer;
}
.snmp-btn:hover { border-color: var(--accent); color: var(--accent); }
.snmp-btn.primary { border-color: var(--accent); color: var(--accent); }
.snmp-btn.primary:hover { background: var(--accent); color: var(--bg-1); }
.snmp-btn.danger { border-color: var(--accent-2); color: var(--accent-2); }
.snmp-btn.danger:hover { background: var(--accent-2); color: var(--bg-1); }
.snmp-btn[data-armed="1"] { background: var(--accent-2); color: var(--bg-1); border-color: var(--accent-2); }
.snmp-btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Profile / binding row containers. */
.snmp-row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--line);
}
.snmp-row:last-child { border-bottom: 0; }
.snmp-row .meta { color: var(--text-dim); font-size: 11px; }
.snmp-row .name { font-weight: 600; }
.snmp-row .actions { display: flex; gap: 6px; }

.snmp-empty { color: var(--text-dim); font-size: 12px; font-style: italic; padding: 8px 0; }

.snmp-section-h {
    margin: 18px 0 6px; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
}
.snmp-section-h:first-child { margin-top: 0; }

/* Per-device sidebar health dot. */
.device-row .health {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; opacity: 0.85;
}
.device-row .health.ok    { background: var(--accent); }
.device-row .health.stale { background: var(--accent-2); }
.device-row .health.error { background: #e54848; }
.device-row .health.none  { background: transparent; border: 1px solid var(--text-dim); }

/* Decommission indicator: red X shown when an exporter hasn't sent a flow
 * record in 5+ minutes. Cleared automatically when traffic resumes. */
.device-row .decom {
    color: var(--danger);
    font-weight: 700;
    margin-right: 6px;
    font-family: "JetBrains Mono", monospace;
}
.device-row.decommissioned .label-text { color: var(--text-dim); }

/* Sidebar refresh countdown — shows how long until the next data refresh.
 * Lives in the "Exporters" section header so it's always visible without
 * adding chrome. */
.refresh-countdown {
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 1px;
    font-weight: 400;
}
aside h3.sidebar-h-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Inline error / success toast under a form (no popups). */
.snmp-msg { padding: 6px 10px; margin-top: 6px; font-size: 12px; border-left: 2px solid var(--text-dim); }
.snmp-msg.err { color: #e54848; border-color: #e54848; background: rgba(229,72,72,0.06); }
.snmp-msg.ok  { color: var(--accent); border-color: var(--accent); background: rgba(108,240,194,0.06); }

/* Status table */
.snmp-status-table { width: 100%; border-collapse: collapse; }
.snmp-status-table th, .snmp-status-table td {
    padding: 6px 10px; text-align: left; font-size: 12px;
    border-bottom: 1px solid var(--line);
}
.snmp-status-table th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; }
.snmp-status-table .err { color: #e54848; font-family: var(--mono, monospace); }
</style>
</head>
<body>
<div class="app">

                    background:var(--bg-2); border:1px solid var(--line);

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
            </button>

        <span><span class="ok">●</span> COLLECTOR ONLINE</span>
        <span id="foot-selected">VIEW: ALL DEVICES</span>
        <span id="foot-status" class="live-ok" style="margin-left:auto">● LIVE</span>
        <span id="foot-time">—</span>

</div>

<script>
// ===== State =====
const RANGE_OPTIONS = [
    { label: "3m",  seconds: 180   },
    { label: "15m", seconds: 900   },
    { label: "1h",  seconds: 3600  },
    { label: "6h",  seconds: 21600 },
];
const RANGE_KEY = "flowscope:range";
const ALLOWED_RANGE_SECONDS = RANGE_OPTIONS.map(r => r.seconds);
const savedRange = parseInt(localStorage.getItem(RANGE_KEY) || "0", 10);
const initialRange = ALLOWED_RANGE_SECONDS.includes(savedRange) ? savedRange : 180;

// Folders are server-side (promoted from localStorage in v0.x). A device may
// belong to at most one folder; everything else renders in the unfoldered
// "root" list. Collapsed/expanded state remains a per-browser UI preference,
// stored in localStorage keyed by folder id.
const FOLDERS_KEY            = "flowscope:folders";          // legacy, used only for migration
const FOLDERS_COLLAPSED_KEY  = "flowscope:folders:collapsed"; // {[id]: true}
function loadCollapsedMap() {
    try { return JSON.parse(localStorage.getItem(FOLDERS_COLLAPSED_KEY) || "{}") || {}; }
    catch (e) { return {}; }
}
function saveCollapsedMap(m) {
    localStorage.setItem(FOLDERS_COLLAPSED_KEY, JSON.stringify(m));
}
function applyCollapsedFromLocalStorage(folders) {
    const m = loadCollapsedMap();
    return folders.map(f => Object.assign({}, f, { collapsed: !!m[f.id] }));
}
async function fetchFoldersFromServer() {
    return applyCollapsedFromLocalStorage(await api("/api/folders"));
}
// One-shot migration: if the server has zero folders and localStorage has
// some, upload them, then clear the legacy key. Safe to call on every boot;
// it no-ops once the server is the source of truth.
async function migrateFoldersIfNeeded() {
    let raw;
    try { raw = JSON.parse(localStorage.getItem(FOLDERS_KEY) || "[]"); }
    catch (e) { raw = []; }
    if (!Array.isArray(raw) || raw.length === 0) return false;
    const onServer = await api("/api/folders");
    if (onServer.length > 0) {
        // Server already authoritative; drop the legacy key without uploading.
        localStorage.removeItem(FOLDERS_KEY);
        return false;
    }
    for (const f of raw) {
        const name = (f && f.name || "").trim();
        if (!name) continue;
        try {
            await apiSend("/api/folders", "POST", {
                name,
                exporters: Array.isArray(f.deviceIps) ? f.deviceIps : [],
            });
        } catch (e) {
            // 409 = name already created on the server in a parallel migration.
            // Anything else: log and continue so a single bad row doesn't block
            // the rest.
            console.warn("folder migration:", name, e.message);
        }
    }
    localStorage.removeItem(FOLDERS_KEY);
    return true;
}
async function bootstrapFolders() {
    try {
        await migrateFoldersIfNeeded();
        state.folders = await fetchFoldersFromServer();
        renderSidebar();
    } catch (e) {
        console.warn("folder bootstrap failed:", e.message);
    }
}

const state = {
    activeTab: "overview",
    selectedExporter: null,
    ifindexFilter: null,        // server-side ifindex filter for flows + timeseries
    timeseriesSeconds: initialRange,
    summary: null,
    devices: [],
    interfaces: [],
    flows: [],
    timeseries: null,
    topTalkers: [],
    topPorts: [],
    protocols: [],
    folders: [],                // [{ id, name, sort_order, collapsed, deviceIps: [] }] — loaded async at boot
    tableState: {},             // per-table { sort, dir, filter }
    paused: false,              // refresh paused (e.g. while a label is being edited)
    lastUpdate: null,           // ms timestamp of last successful refresh
    lastError:  null,
    // SNMP (Phase 4) — refreshed on every poll regardless of active tab so
    // the per-device health dots in the sidebar and the top-bar chip stay
    // current. Heavier than necessary if SNMP is never used; fine for now.
    snmpProfiles: [],
    snmpBindings: [],
    snmpStatus:   { summary: { ok: 0, stale: 0, error: 0, total: 0 },
                    config: { mock: false, key_configured: false },
                    devices: [] },
    snmpStatusByExporter: {},   // exporter -> status row, rebuilt on every refresh
    // Two-step delete confirmation. {key: timeoutId} — see armConfirm/disarmConfirm.
    snmpConfirmArmed: {},
};

// ===== Utilities =====
function bytesHuman(n) {
    if (n == null || isNaN(n)) return "—";
    if (n < 1024) return n + " B";
    const u = ["KB","MB","GB","TB","PB"];
    let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < u.length-1);
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + " " + u[i];
}
function bitsHuman(n) {
    n = n * 8;
    if (n < 1000) return n.toFixed(0) + " bps";
    const u = ["Kbps","Mbps","Gbps","Tbps"];
    let i = -1; do { n /= 1000; i++; } while (n >= 1000 && i < u.length-1);
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + " " + u[i];
}
function numHuman(n) {
    if (n == null) return "—";
    if (n < 1000) return n.toString();
    const u = ["K","M","B","T"];
    let i = -1; do { n /= 1000; i++; } while (n >= 1000 && i < u.length-1);
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + u[i];
}
function timeAgo(ts) {
    if (!ts) return "—";
    const s = Math.floor(Date.now()/1000 - ts);
    if (s < 2)     return "now";
    if (s < 60)    return s + "s";
    if (s < 3600)  return Math.floor(s/60)   + "m";
    if (s < 86400) return Math.floor(s/3600) + "h";
    return Math.floor(s/86400) + "d";
}
function uptimeHuman(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`;
}
function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

// Endpoint cell: hostname (when known) over dim IP. Falls back to IP-only.
// `port` is optional; if given it's appended to the line that holds the IP.
function endpointHtml(ip, host, port) {
    const ipPort = (ip || "?") + (port ? ":" + port : "");
    if (host) {
        return `<span class="endpoint">
            <span class="host">${escapeHtml(host)}</span>
            <span class="ip">${escapeHtml(ipPort)}</span>
        </span>`;
    }
    return `<span class="endpoint">
        <span class="host">${escapeHtml(ipPort)}</span>
    </span>`;
}

// ===== API =====
// Bearer token: when the server sets FLOWSCOPE_AUTH_TOKEN, the first /api/*
// call returns 401; we prompt once, cache the token in sessionStorage, retry.
// All subsequent calls (including concurrent ones in flight) share the same
// token via tokenPromise so the user only ever sees one prompt at a time.
const AUTH_TOKEN_KEY = "flowscope:authToken";
let _tokenPromise = null;
function getToken()    { return sessionStorage.getItem(AUTH_TOKEN_KEY) || ""; }
function setToken(t)   {
    if (t) sessionStorage.setItem(AUTH_TOKEN_KEY, t);
    else   sessionStorage.removeItem(AUTH_TOKEN_KEY);
}
function promptForToken(reason) {
    if (_tokenPromise) return _tokenPromise;
    _tokenPromise = new Promise(resolve => {
        // setTimeout 0 so the prompt isn't fired from inside a fetch()
        // microtask — some browsers throttle prompts in that context.
        setTimeout(() => {
            const msg = (reason === "bad")
                ? "Authentication failed. Re-enter the FlowScope auth token:"
                : "Authentication required.\nEnter the FlowScope auth token:";
            const t = window.prompt(msg, "");
            if (t != null) setToken(t.trim());
            _tokenPromise = null;
            resolve(getToken());
        }, 0);
    });
    return _tokenPromise;
}
async function authedFetch(path, init) {
    init = init || {};
    const headers = Object.assign({}, init.headers || {});
    const tok = getToken();
    if (tok) headers["X-Auth-Token"] = tok;
    let r = await fetch(path, Object.assign({}, init, { headers }));
    if (r.status !== 401) return r;
    // First 401: prompt once, retry once. If we still 401, give up and
    // clear the bad token so the next call re-prompts cleanly.
    await promptForToken(tok ? "bad" : "first");
    const tok2 = getToken();
    if (!tok2) throw new Error(`${path}: 401 (no token)`);
    headers["X-Auth-Token"] = tok2;
    r = await fetch(path, Object.assign({}, init, { headers }));
    if (r.status === 401) {
        setToken("");
        throw new Error(`${path}: 401 (bad token)`);
    }
    return r;
}
async function api(path) {
    const r = await authedFetch(path);
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return await r.json();
}
async function apiSend(path, method, body) {
    const r = await authedFetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    // 204 No Content (common for DELETE) and empty 200 bodies must not call
    // r.json() — it would throw on the empty body.
    if (r.status === 204) return null;
    const text = await r.text();
    return text ? JSON.parse(text) : null;
}
function buildParams(extra = {}) {
    const p = new URLSearchParams();
    if (state.selectedExporter) p.set("exporter", state.selectedExporter);
    if (state.ifindexFilter != null) p.set("ifindex", state.ifindexFilter);
    for (const [k, v] of Object.entries(extra)) p.set(k, v);
    const s = p.toString();
    return s ? "?" + s : "";
}

// ===== Polling =====
const REFRESH_INTERVAL_MS = 3000;
state.nextRefreshAt = 0;

// Fetch every API endpoint we care about and store results in state.* slots.
// Returns false when fetch was suppressed (paused) so callers can skip render.
async function fetchAllData() {
    if (state.paused) return false;
    // Interfaces and devices ignore ifindex; flows + timeseries honor it.
    const exporterOnly = state.selectedExporter
        ? `?exporter=${encodeURIComponent(state.selectedExporter)}`
        : "";
    const flowsParams = buildParams({ limit: 200 });
    const tsParams    = buildParams({ seconds: state.timeseriesSeconds });
    const settled = await Promise.allSettled([
        api("/api/summary"),
        api("/api/devices"),
        api("/api/interfaces" + exporterOnly),
        api("/api/flows/recent" + flowsParams),
        api("/api/timeseries"   + tsParams),
        api("/api/top/talkers"  + (exporterOnly ? exporterOnly + "&limit=15" : "?limit=15")),
        api("/api/top/ports"    + (exporterOnly ? exporterOnly + "&limit=10" : "?limit=10")),
        api("/api/protocols"    + exporterOnly),
        api("/api/snmp/profiles"),
        api("/api/snmp/bindings"),
        api("/api/snmp/status"),
    ]);
    const slots = ["summary", "devices", "interfaces", "flows",
                   "timeseries", "topTalkers", "topPorts", "protocols",
                   "snmpProfiles", "snmpBindings", "snmpStatus"];
    let anyOk = false, anyErr = null;
    settled.forEach((r, i) => {
        if (r.status === "fulfilled" && r.value != null) {
            state[slots[i]] = r.value;
            anyOk = true;
        } else if (r.status === "rejected") {
            anyErr = r.reason;
        }
    });
    if (anyOk) {
        state.lastUpdate = Date.now();
        state.lastError = null;
    }
    if (anyErr && !anyOk) {
        state.lastError = String(anyErr);
        console.warn("refresh failed:", anyErr);
    }
    return anyOk;
}

// User-initiated refresh: full DOM re-render. Used by click handlers (tab
// switch, exporter select, label edit, …) where structural changes are
// expected and a clean rebuild is desirable.
async function refreshAll() {
    const ok = await fetchAllData();
    if (!ok) return;
    preserveFocus(() => render());
}

// Background tick: pulls new data and updates only the parts of the page that
// actually carry time-varying values — header counters, sidebar device meta,
// the active tab's graphs and table bodies, and the footer. The sidebar
// structure, tab chrome, SNMP forms, and modals are all left untouched so
// they don't flicker, lose hover state, or steal focus mid-keystroke.
async function autoRefresh() {
    state.nextRefreshAt = Date.now() + REFRESH_INTERVAL_MS;
    const ok = await fetchAllData();
    if (!ok) return;
    const safe = (name, fn) => { try { fn(); } catch (e) {
        console.error(`autoRefresh:${name} failed`, e);
    } };
    safe("snmp-index", () => {
        state.snmpStatusByExporter = {};
        const devs = state.snmpStatus && state.snmpStatus.devices || [];
        devs.forEach(r => { state.snmpStatusByExporter[r.exporter] = r; });
    });
    safe("snmp-chip", updateSnmpChip);
    safe("header",  renderHeader);
    safe("sidebar", softUpdateSidebar);
    safe("tab",     softUpdateActiveTab);
    safe("footer",  renderFooter);
}

function updateSnmpChip() {
    const chip = document.getElementById("snmp-chip");
    if (!chip) return;
    const summ = state.snmpStatus && state.snmpStatus.summary;
    if (!summ || !summ.total) {
        chip.className = "snmp-chip empty";
        chip.textContent = "";
    } else if (summ.error > 0) {
        chip.className = "snmp-chip health-error";
        chip.textContent = `${summ.error} err`;
    } else if (summ.stale > 0) {
        chip.className = "snmp-chip health-stale";
        chip.textContent = `${summ.stale} stale`;
    } else {
        chip.className = "snmp-chip health-ok";
        chip.textContent = `${summ.ok}/${summ.total}`;
    }
}

// Sidebar in-place update. Rather than reflow innerHTML on every tick (which
// kills hover state, scroll position, and click responsiveness), we walk the
// existing rows and update only their data. Falls back to a full renderSidebar
// when the device set has changed (new/removed exporter or folder
// add/remove/rename) — those are user-initiated and rare enough that the
// occasional full rebuild is fine.
function softUpdateSidebar() {
    const list = document.getElementById("device-list");
    if (!list) return;
    if (!state.devices.length && !state.folders.length) return;

    // Compute the device set we expect to be in the DOM right now (excludes
    // members of collapsed folders). If it doesn't match what's actually
    // there, fall back to a full sidebar render so the structure catches up.
    const ipToFolder = {};
    (state.folders || []).forEach(f => {
        (f.deviceIps || []).forEach(ip => { ipToFolder[ip] = f.id; });
    });
    const expected = new Set();
    (state.devices || []).forEach(d => {
        const fid = ipToFolder[d.exporter];
        if (fid != null) {
            const folder = state.folders.find(f => f.id === fid);
            if (folder && folder.collapsed) return;
        }
        expected.add(d.exporter);
    });
    const inDom = new Set();
    list.querySelectorAll(".device-row").forEach(r => {
        if (r.dataset.exporter) inDom.add(r.dataset.exporter);
    });
    if (expected.size !== inDom.size) { renderSidebar(); return; }
    for (const exp of expected) {
        if (!inDom.has(exp)) { renderSidebar(); return; }
    }

    // Same set of rows present — update each one in place.
    const byIp = {};
    (state.devices || []).forEach(d => { byIp[d.exporter] = d; });
    list.querySelectorAll(".device-row").forEach(row => {
        const d = byIp[row.dataset.exporter];
        if (d) updateDeviceRowInPlace(row, d);
    });
}

function updateDeviceRowInPlace(row, d) {
    // Health dot — class can change as SNMP poll status moves between
    // ok / stale / error / none.
    const healthSpan = row.querySelector(".health");
    if (healthSpan) {
        const h = snmpHealth(d.exporter);
        const desired = "health " + h;
        if (healthSpan.className !== desired) healthSpan.className = desired;
    }
    // Decommission state. Toggle the row class + insert/remove the ✕ icon.
    const stale = isDecommissioned(d);
    row.classList.toggle("decommissioned", stale);
    const ip = row.querySelector(".ip");
    if (ip) {
        let decom = ip.querySelector(".decom");
        if (stale && !decom) {
            decom = document.createElement("span");
            decom.className = "decom";
            decom.title = "No flows in 5+ minutes — possibly decommissioned";
            decom.textContent = "✕";
            ip.insertBefore(decom, ip.firstChild);
        } else if (!stale && decom) {
            decom.remove();
        }
    }
    // Meta line: ifs / flows count / last-seen text. Rebuilding the inner
    // HTML of the meta div is cheap and keeps the markup identical to what
    // deviceRowHtml emits — no chance of the two paths drifting.
    const meta = row.querySelector(".meta");
    if (meta) {
        const next = `<span class="badge ${d.type}">${escapeHtml(d.type)}</span>
            ${d.interface_count} ifs · ${numHuman(d.flow_count)} flows ·
            <span class="time-ago" data-last-seen="${d.last_seen}">${timeAgo(d.last_seen)}</span>`;
        // Compare-and-set avoids unnecessary reflows when nothing changed.
        if (meta.innerHTML !== next) meta.innerHTML = next;
    }
}

// Update only the active tab's data-bearing parts. The panel chrome (head,
// chips, controls, table headers) stays put — only canvases redraw and only
// table tbodies are replaced.
function softUpdateActiveTab() {
    const root = document.getElementById("tab-content");
    if (!root) return;
    const tab = state.activeTab;
    if (tab === "snmp") {
        updateSnmpInPlace();
        return;
    }
    if (tab === "setup") return;
    if (tab === "overview") {
        // If the overview chrome isn't on screen (e.g. setup-card was rendered
        // because devices was empty), let the regular path catch up.
        if (!document.getElementById("ts-canvas")) { renderTab(); return; }
        drawTimeseries();
        softReplaceTable("top-talkers", renderTopTalkersTable());
        softReplaceTable("top-ports",   renderTopPortsTable());
        softReplaceTable("protocols",   renderProtocolTable());
        return;
    }
    if (tab === "interfaces") {
        if (!document.querySelector('.table-wrap[data-table="interfaces"]')) {
            renderTab(); return;
        }
        if (softReplaceTable("interfaces", renderInterfaces())) {
            // Tbody was rebuilt — old <a class="iface-view"> nodes are gone,
            // re-attach click handlers to the fresh ones. (renderTab also
            // calls wireInterfaceTable, so we only do it on the soft path.)
            wireInterfaceTable();
        } else {
            renderTab();
        }
        return;
    }
    if (tab === "flows") {
        if (!document.querySelector('.table-wrap[data-table="flows"]')) {
            renderTab(); return;
        }
        if (!softReplaceTable("flows", renderFlows())) renderTab();
        return;
    }
}

// Soft-replace a table's tbody (and the "rows" counter) without rebuilding
// its surrounding chrome. The fullHtml argument can be either a bare
// .table-wrap (e.g. from makeTable) or a wider chunk that contains one — we
// extract by data-table id either way.
function softReplaceTable(id, fullHtml) {
    const wrap = document.querySelector(`.table-wrap[data-table="${id}"]`);
    if (!wrap) return false;
    const tmp = document.createElement("div");
    tmp.innerHTML = fullHtml;
    const newWrap = tmp.querySelector(`.table-wrap[data-table="${id}"]`);
    if (!newWrap) return false;
    const newTbody = newWrap.querySelector("tbody");
    const oldTbody = wrap.querySelector("tbody");
    if (newTbody && oldTbody && newTbody.innerHTML !== oldTbody.innerHTML) {
        oldTbody.innerHTML = newTbody.innerHTML;
    }
    const newMeta = newWrap.querySelector(".table-meta");
    const oldMeta = wrap.querySelector(".table-meta");
    if (newMeta && oldMeta && newMeta.textContent !== oldMeta.textContent) {
        oldMeta.textContent = newMeta.textContent;
    }
    return true;
}

// Save and restore focus / cursor on a focused .table-filter input across
// re-renders. Without this, auto-refresh kicks the user out of the box mid-type.
function preserveFocus(fn) {
    const active = document.activeElement;
    let restore = null;
    if (active && active.classList && active.classList.contains("table-filter")) {
        const wrap = active.closest(".table-wrap");
        restore = {
            id: wrap && wrap.dataset.table,
            cursor: active.selectionStart,
        };
    }
    fn();
    if (restore && restore.id) {
        const ni = document.querySelector(
            `.table-wrap[data-table="${restore.id}"] .table-filter`);
        if (ni) {
            ni.focus();
            try { ni.setSelectionRange(restore.cursor, restore.cursor); }
            catch (e) { /* ignore */ }
        }
    }
}

// ===== Sortable / filterable table helper =====
// Each column = { key, label, cls?, value?(row), render?(row), sortable? }
// `value(row)` is used for both filter matching and sort comparison so callers
// can sort a "Volume" cell by raw bytes while still rendering it formatted.
function makeTable(id, columns, rows, opts = {}) {
    if (!state.tableState[id]) {
        state.tableState[id] = {
            sort: opts.defaultSort || null,
            dir:  opts.defaultDir  || -1,
            filter: "",
        };
    }
    const ts = state.tableState[id];
    const f  = ts.filter.trim().toLowerCase();
    let visible = rows;
    if (f) {
        visible = rows.filter(r => columns.some(c => {
            const v = c.value ? c.value(r) : r[c.key];
            return String(v == null ? "" : v).toLowerCase().includes(f);
        }));
    }
    if (ts.sort) {
        const col = columns.find(c => c.key === ts.sort);
        if (col) {
            visible = visible.slice().sort((a, b) => {
                const av = col.value ? col.value(a) : a[col.key];
                const bv = col.value ? col.value(b) : b[col.key];
                const aN = (av == null), bN = (bv == null);
                if (aN && bN) return 0;
                if (aN) return 1;
                if (bN) return -1;
                if (typeof av === "number" && typeof bv === "number") {
                    return (av - bv) * ts.dir;
                }
                return String(av).localeCompare(String(bv)) * ts.dir;
            });
        }
    }
    const arrow = key => ts.sort === key ? (ts.dir === 1 ? " ↑" : " ↓") : "";
    return `
        <div class="table-wrap" data-table="${escapeHtml(id)}">
            <div class="table-controls">
                <input class="table-filter" placeholder="filter…"
                       value="${escapeHtml(ts.filter)}">
                <span class="table-meta">${visible.length}${
                    visible.length !== rows.length ? ` / ${rows.length}` : ""
                } rows</span>
            </div>
            <table>
                <thead><tr>
                    ${columns.map(c => {
                        const sortable = c.sortable !== false;
                        const cls = [
                            c.cls || "",
                            sortable ? "sortable" : "",
                            ts.sort === c.key ? "sort-active" : "",
                        ].filter(Boolean).join(" ");
                        return `<th class="${cls}"${sortable ? ` data-col="${escapeHtml(c.key)}"` : ""}>${
                            escapeHtml(c.label)}${sortable ? arrow(c.key) : ""}</th>`;
                    }).join("")}
                </tr></thead>
                <tbody>
                    ${visible.length === 0
                      ? `<tr><td colspan="${columns.length}"
                              style="color:var(--text-faint);text-align:center;padding:24px">
                              ${rows.length === 0 ? "No data yet."
                                                  : "No rows match filter."}
                         </td></tr>`
                      : visible.map(r => `<tr>${columns.map(c =>
                            c.render
                                ? c.render(r)
                                : `<td class="${c.cls || ""}">${
                                       escapeHtml(r[c.key] == null ? "" : r[c.key])
                                   }</td>`
                        ).join("")}</tr>`).join("")
                    }
                </tbody>
            </table>
        </div>
    `;
}

function wireTables() {
    document.querySelectorAll(".table-wrap").forEach(w => {
        const id = w.dataset.table;
        const ts = state.tableState[id];
        if (!ts) return;
        const input = w.querySelector(".table-filter");
        if (input) {
            input.addEventListener("input", () => {
                ts.filter = input.value;
                preserveFocus(() => renderTab());
            });
        }
        w.querySelectorAll("th.sortable").forEach(th => {
            th.addEventListener("click", () => {
                const col = th.dataset.col;
                if (ts.sort === col) ts.dir *= -1;
                else { ts.sort = col; ts.dir = -1; }
                renderTab();
            });
        });
    });
}

// ===== Modal dialogs (replace browser prompt/confirm/alert) =====
// Pauses background polling while open so the page doesn't shift under the
// dialog. Returns a Promise: appPrompt → string|null, appConfirm/appAlert →
// boolean, appChoice → the picked value or null.
function _showModal({ title, bodyHtml, footerHtml, wireBody, onOk, onCancel, enterSubmits }) {
    state.paused = true;
    return new Promise(resolve => {
        const ov = document.createElement("div");
        ov.className = "modal-overlay";
        ov.innerHTML = `
            <div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title || "")}">
                <div class="modal-head">${escapeHtml(title || "")}</div>
                <div class="modal-body">${bodyHtml}</div>
                <div class="modal-foot">${footerHtml}</div>
            </div>`;
        document.body.appendChild(ov);

        const finish = (val) => {
            ov.remove();
            document.removeEventListener("keydown", onKey, true);
            state.paused = false;
            resolve(val);
        };
        const okBtn     = ov.querySelector('[data-act="ok"]');
        const cancelBtn = ov.querySelector('[data-act="cancel"]');
        if (okBtn)     okBtn.addEventListener("click", () => finish(onOk ? onOk(ov) : true));
        if (cancelBtn) cancelBtn.addEventListener("click", () => finish(onCancel ? onCancel() : null));
        ov.addEventListener("click", (ev) => {
            if (ev.target === ov) finish(onCancel ? onCancel() : null);
        });

        const onKey = (ev) => {
            if (ev.key === "Escape") {
                ev.preventDefault();
                finish(onCancel ? onCancel() : null);
            } else if (ev.key === "Enter" && enterSubmits && okBtn) {
                ev.preventDefault();
                finish(onOk ? onOk(ov) : true);
            }
        };
        document.addEventListener("keydown", onKey, true);

        if (wireBody) wireBody(ov, finish);

        const inp = ov.querySelector(".modal-input");
        if (inp) { inp.focus(); inp.select(); }
        else if (okBtn) okBtn.focus();
    });
}

function appPrompt(title, body, defaultValue) {
    return _showModal({
        title,
        bodyHtml: `${body ? `<div class="body-text">${escapeHtml(body)}</div>` : ""}
                   <input type="text" class="modal-input"
                          value="${escapeHtml(defaultValue == null ? "" : defaultValue)}">`,
        footerHtml: `<button data-act="cancel">Cancel</button>
                     <button data-act="ok" class="primary">OK</button>`,
        enterSubmits: true,
        onOk: (ov) => ov.querySelector(".modal-input").value,
        onCancel: () => null,
    });
}

function appConfirm(title, body, danger) {
    return _showModal({
        title,
        bodyHtml: `<div class="body-text">${escapeHtml(body || "")}</div>`,
        footerHtml: `<button data-act="cancel">Cancel</button>
                     <button data-act="ok" class="${danger ? "danger" : "primary"}">${danger ? "Delete" : "OK"}</button>`,
        enterSubmits: true,
        onOk: () => true,
        onCancel: () => false,
    });
}

function appAlert(title, body) {
    return _showModal({
        title,
        bodyHtml: `<div class="body-text">${escapeHtml(body || "")}</div>`,
        footerHtml: `<button data-act="ok" class="primary">OK</button>`,
        enterSubmits: true,
        onOk: () => true,
        onCancel: () => true,
    });
}

// choices: [{ label, value, muted? }, ...]. Buttons are rendered vertically;
// clicking one resolves to its `value`. Cancel / Esc / backdrop resolves null.
function appChoice(title, body, choices) {
    return _showModal({
        title,
        bodyHtml: `${body ? `<div class="body-text">${escapeHtml(body)}</div>` : ""}
                   <div class="modal-choices">${
                       choices.map((c, i) =>
                           `<button class="modal-choice ${c.muted ? "muted" : ""}" data-i="${i}">${escapeHtml(c.label)}</button>`
                       ).join("")
                   }</div>`,
        footerHtml: `<button data-act="cancel">Cancel</button>`,
        enterSubmits: false,
        onCancel: () => null,
        wireBody: (ov, finish) => {
            ov.querySelectorAll(".modal-choice").forEach(b => {
                b.addEventListener("click", () => {
                    finish(choices[parseInt(b.dataset.i, 10)].value);
                });
            });
        },
    });
}

// ===== Label editing =====
async function editExporterLabel(ip, current) {
    const v = await appPrompt(
        `Label for ${ip}`,
        "Display name shown in the sidebar. Leave blank to clear.",
        current || "");
    if (v == null) return;
    state.paused = true;
    try {
        await apiSend(`/api/exporters/${encodeURIComponent(ip)}/label`,
                      "PUT", { label: v });
    } catch (e) {
        await appAlert("Save failed", "Failed to save label: " + e.message);
    } finally {
        state.paused = false;
        refreshAll();
    }
}

async function editInterfaceLabel(exporter, ifindex, current) {
    const v = await appPrompt(
        `Label for ${exporter} if${ifindex}`,
        "Display name shown in the Interfaces tab. Leave blank to clear.",
        current || "");
    if (v == null) return;
    state.paused = true;
    try {
        await apiSend(`/api/interfaces/${encodeURIComponent(exporter)}/${ifindex}/label`,
                      "PUT", { label: v });
    } catch (e) {
        await appAlert("Save failed", "Failed to save label: " + e.message);
    } finally {
        state.paused = false;
        refreshAll();
    }
}

// What to display for an exporter: prefer user label, then reverse-DNS, then IP.
function exporterDisplayName(d) {
    return d.label || d.hostname || d.exporter;
}

// ===== Rendering =====
function render() {
    // Each step independent so a single broken renderer can't strand the
    // rest. Without this, an exception in (say) renderSidebar means the
    // chart and tables silently stop refreshing and the user has to click
    // a tab to recover — which is what was happening with click-driven
    // refreshes feeling broken.
    const safe = (name, fn) => { try { fn(); } catch (e) {
        console.error(`render:${name} failed`, e);
    } };
    // Rebuild SNMP per-device lookup before sidebar render so the health
    // dots can read state.snmpStatusByExporter in O(1).
    safe("snmp-index", () => {
        state.snmpStatusByExporter = {};
        const devs = state.snmpStatus && state.snmpStatus.devices || [];
        devs.forEach(r => { state.snmpStatusByExporter[r.exporter] = r; });
    });
    // Header chip on the SNMP tab summarizing health at a glance.
    safe("snmp-chip", () => {
        const chip = document.getElementById("snmp-chip");
        if (!chip) return;
        const summ = state.snmpStatus && state.snmpStatus.summary;
        if (!summ || !summ.total) {
            chip.className = "snmp-chip empty";
            chip.textContent = "";
        } else if (summ.error > 0) {
            chip.className = "snmp-chip health-error";
            chip.textContent = `${summ.error} err`;
        } else if (summ.stale > 0) {
            chip.className = "snmp-chip health-stale";
            chip.textContent = `${summ.stale} stale`;
        } else {
            chip.className = "snmp-chip health-ok";
            chip.textContent = `${summ.ok}/${summ.total}`;
        }
    });
    safe("header",  renderHeader);
    safe("sidebar", renderSidebar);
    safe("tab",     renderTab);
    safe("footer",  renderFooter);
}

function renderHeader() {
    const s = state.summary;
    if (!s) return;
    document.getElementById("hdr-nf").textContent    = numHuman(s.netflow_packets);
    document.getElementById("hdr-sf").textContent    = numHuman(s.sflow_packets);
    document.getElementById("hdr-flows").textContent = numHuman(s.flows_recorded);
    document.getElementById("hdr-dev").textContent   = s.device_count;
    document.getElementById("hdr-up").textContent    = uptimeHuman(s.uptime_seconds);
    document.getElementById("empty-nf-port").textContent = s.ports.netflow;
    document.getElementById("empty-sf-port").textContent = s.ports.sflow;
}

function renderFooter() {
    let viewLabel = "VIEW: ALL DEVICES";
    if (state.selectedExporter) {
        const d = state.devices.find(x => x.exporter === state.selectedExporter);
        viewLabel = "VIEW: " + (d ? exporterDisplayName(d) : state.selectedExporter);
    }
    document.getElementById("foot-selected").textContent = viewLabel;
    const stat = document.getElementById("foot-status");
    if (state.lastError && !state.lastUpdate) {
        stat.textContent = "● STALLED";
        stat.className = "live-stale";
    } else if (state.lastUpdate) {
        const age = Math.floor((Date.now() - state.lastUpdate) / 1000);
        const stale = age > 10;
        stat.textContent = stale
            ? `● STALE ${age}s`
            : `● LIVE · ${new Date(state.lastUpdate).toLocaleTimeString()}`;
        stat.className = stale ? "live-stale" : "live-ok";
    } else {
        stat.textContent = "● CONNECTING…";
        stat.className = "";
    }
    document.getElementById("foot-time").textContent =
        new Date().toISOString().replace("T"," ").slice(0,19) + " UTC";
}

// Treat a device as decommissioned when it hasn't reported a flow record in
// 5+ minutes. Returns false for devices we've never seen so a brand-new
// dashboard load doesn't immediately mark everything stale.
const DECOM_THRESHOLD_S = 300;
function isDecommissioned(d) {
    if (!d || !d.last_seen) return false;
    return (Date.now() / 1000 - d.last_seen) > DECOM_THRESHOLD_S;
}

function deviceRowHtml(d) {
    const display = exporterDisplayName(d);
    const showIp = display !== d.exporter;
    const health = snmpHealth(d.exporter);
    const healthTitle = health === "ok"   ? "SNMP poll healthy"
                      : health === "stale" ? "SNMP poll stale"
                      : health === "error" ? "SNMP poll failing"
                      : "SNMP not configured";
    const stale = isDecommissioned(d);
    const cls = ["device-row"];
    if (state.selectedExporter === d.exporter) cls.push("active");
    if (stale) cls.push("decommissioned");
    return `
    <div class="${cls.join(" ")}"
         data-exporter="${escapeHtml(d.exporter)}">
        <div class="ip">
            ${stale ? `<span class="decom" title="No flows in 5+ minutes — possibly decommissioned">✕</span>` : ""}
            <span class="health ${health}" title="${healthTitle}"></span>
            <span class="actions move" data-move-exporter="${escapeHtml(d.exporter)}"
                  title="Move to folder">⤴</span>
            <span class="actions" data-edit-exporter="${escapeHtml(d.exporter)}"
                  data-current="${escapeHtml(d.label || "")}"
                  title="Edit label">✎</span>
            <span class="label-text">${escapeHtml(display)}</span>
            ${showIp ? `<span class="ip-text">${escapeHtml(d.exporter)}</span>` : ""}
        </div>
        <div class="meta">
            <span class="badge ${d.type}">${d.type}</span>
            ${d.interface_count} ifs · ${numHuman(d.flow_count)} flows ·
            <span class="time-ago" data-last-seen="${d.last_seen}">${timeAgo(d.last_seen)}</span>
        </div>
    </div>`;
}

function renderSidebar() {
    const list = document.getElementById("device-list");
    // No devices and no folders: leave the static empty-state in place so the
    // port codes (#empty-nf-port / #empty-sf-port) keep getting populated.
    if (!state.devices.length && !state.folders.length) return;

    // Folders sorted by name (case-insensitive); devices sorted by display
    // name. Sort copies, never the originals — server-backed state shouldn't
    // depend on render order. Coerce to string defensively: a missing name
    // from a malformed folder/device record blows up the comparator and the
    // entire sidebar render with it, leaving the rest of the page stale
    // until a tab click.
    const cmp = (a, b) => String(a == null ? "" : a)
        .localeCompare(String(b == null ? "" : b), undefined, { sensitivity: "base" });
    const sortedFolders = state.folders.slice().sort((a, b) => cmp(a.name, b.name));
    const sortedDevices = state.devices.slice().sort((a, b) =>
        cmp(exporterDisplayName(a), exporterDisplayName(b))
    );

    // ip → folderId lookup; devices not present here render in the root list.
    const ipToFolder = {};
    sortedFolders.forEach(f => f.deviceIps.forEach(ip => { ipToFolder[ip] = f.id; }));

    let html = "";
    sortedFolders.forEach(f => {
        const members = sortedDevices.filter(d => ipToFolder[d.exporter] === f.id);
        const expanded = !f.collapsed;
        html += `
        <div class="folder" data-folder="${escapeHtml(f.id)}">
            <div class="folder-header" data-toggle="${escapeHtml(f.id)}">
                <span class="chev">${expanded ? "▾" : "▸"}</span>
                <span class="name">${escapeHtml(f.name)}</span>
                <span class="count">${members.length}</span>
                <span class="ico"     data-rename="${escapeHtml(f.id)}" title="Rename folder">✎</span>
                <span class="ico del" data-delete="${escapeHtml(f.id)}" title="Delete folder">×</span>
            </div>
            ${expanded ? `<div class="folder-children">${
                members.length
                    ? members.map(deviceRowHtml).join("")
                    : `<div class="folder-empty">empty — use ⤴ on a device</div>`
            }</div>` : ""}
        </div>`;
    });
    // Root list: devices not assigned to any folder.
    const ungrouped = sortedDevices.filter(d => !ipToFolder[d.exporter]);
    html += ungrouped.map(deviceRowHtml).join("");
    list.innerHTML = html;

    // Device row clicks (delegated from row; sub-icons stop propagation).
    list.querySelectorAll(".device-row").forEach(r => {
        r.addEventListener("click", (ev) => {
            const t = ev.target;
            if (t && t.dataset) {
                if (t.dataset.editExporter) {
                    ev.stopPropagation();
                    editExporterLabel(t.dataset.editExporter, t.dataset.current);
                    return;
                }
                if (t.dataset.moveExporter) {
                    ev.stopPropagation();
                    moveDeviceToFolder(t.dataset.moveExporter);
                    return;
                }
            }
            const exp = r.dataset.exporter;
            const wasSelected = state.selectedExporter === exp;
            state.selectedExporter = wasSelected ? null : exp;
            // Clear interface filter when changing exporter so we don't end
            // up filtering by an ifindex that belongs to a different exporter.
            state.ifindexFilter = null;
            // Optimistic sidebar highlight via direct DOM. Existing panels
            // stay visible (with old scope) until refreshAll returns new
            // data and fires its own render — no flicker, no blank chart.
            list.querySelectorAll(".device-row").forEach(x => {
                x.classList.toggle("active",
                    x.dataset.exporter === state.selectedExporter);
            });
            refreshAll();
        });
    });

    // Folder header clicks: rename, delete, or toggle (default).
    // Folder ids from the server are integers; dataset reads are strings,
    // so cast at the boundary or === lookups in the handlers will miss.
    list.querySelectorAll(".folder-header").forEach(h => {
        h.addEventListener("click", (ev) => {
            const t = ev.target;
            if (t && t.dataset) {
                if (t.dataset.rename) {
                    ev.stopPropagation();
                    renameFolder(Number(t.dataset.rename));
                    return;
                }
                if (t.dataset.delete) {
                    ev.stopPropagation();
                    deleteFolder(Number(t.dataset.delete));
                    return;
                }
            }
            toggleFolder(Number(h.dataset.toggle));
        });
    });
}

// ===== Folder operations (server-backed) =====
// Pattern: prompt the user (sync), call the API (await), refresh state from
// the server response, then renderSidebar(). The sequential await keeps the
// list consistent with the database; folder mutations are user-initiated and
// rare so optimistic UI isn't worth the complexity.
async function refreshFolders() {
    state.folders = await fetchFoldersFromServer();
    renderSidebar();
}
async function addFolder() {
    state.paused = true;
    try {
        const name = await appPrompt("New folder", "Folder name (e.g. Troy, MI):", "");
        if (name == null) return;
        const t = name.trim();
        if (!t) return;
        try {
            await apiSend("/api/folders", "POST", { name: t });
            await refreshFolders();
        } catch (e) {
            await appAlert("Create failed", "Could not create folder: " + e.message);
        }
    } finally { state.paused = false; }
}
async function renameFolder(id) {
    const f = state.folders.find(x => x.id === id);
    if (!f) return;
    state.paused = true;
    try {
        const v = await appPrompt(`Rename folder "${f.name}"`, "New name:", f.name);
        if (v == null) return;
        const t = v.trim();
        if (!t) return;
        try {
            await apiSend(`/api/folders/${encodeURIComponent(id)}`, "PATCH", { name: t });
            await refreshFolders();
        } catch (e) {
            await appAlert("Rename failed", "Could not rename folder: " + e.message);
        }
    } finally { state.paused = false; }
}
async function deleteFolder(id) {
    const f = state.folders.find(x => x.id === id);
    if (!f) return;
    state.paused = true;
    try {
        const ok = await appConfirm(
            `Delete folder "${f.name}"?`,
            "Its devices will return to the root list.",
            true);
        if (!ok) return;
        try {
            await apiSend(`/api/folders/${encodeURIComponent(id)}`, "DELETE");
        } catch (e) {
            await appAlert("Delete failed", "Could not delete folder: " + e.message);
            return;
        }
        // Drop the collapsed-state entry for this folder.
        const m = loadCollapsedMap();
        if (m[id]) { delete m[id]; saveCollapsedMap(m); }
        await refreshFolders();
    } finally { state.paused = false; }
}
function toggleFolder(id) {
    const f = state.folders.find(x => x.id === id);
    if (!f) return;
    f.collapsed = !f.collapsed;
    const m = loadCollapsedMap();
    if (f.collapsed) m[id] = true; else delete m[id];
    saveCollapsedMap(m);
    renderSidebar();
}
async function moveDeviceToFolder(ip) {
    state.paused = true;
    try {
        const sortedFolders = state.folders.slice().sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
        );
        const choices = [
            { label: "Root (no folder)", value: { kind: "root" }, muted: true },
            ...sortedFolders.map(f => ({
                label: f.name,
                value: { kind: "existing", folder: f },
            })),
            { label: "+ New folder…", value: { kind: "new" } },
        ];
        let dest = await appChoice(`Move ${ip}`, "Choose a destination:", choices);
        if (dest == null) return;
        if (dest.kind === "new") {
            const name = await appPrompt("New folder", "Folder name:", "");
            if (name == null) return;
            const t = name.trim();
            if (!t) return;
            dest = { kind: "newWithName", name: t };
        }
        try {
            if (dest.kind === "root") {
                await apiSend(`/api/devices/${encodeURIComponent(ip)}/folder`, "DELETE");
            } else if (dest.kind === "existing") {
                await apiSend(`/api/devices/${encodeURIComponent(ip)}/folder`, "PUT",
                              { folder_id: dest.folder.id });
            } else if (dest.kind === "newWithName") {
                await apiSend("/api/folders", "POST", { name: dest.name, exporters: [ip] });
            }
            await refreshFolders();
        } catch (e) {
            await appAlert("Move failed", "Could not move device: " + e.message);
        }
    } finally { state.paused = false; }
}

function renderTab() {
    const root = document.getElementById("tab-content");
    // SNMP tab manages its own state in-place so the 3s refresh doesn't
    // tear down forms, scroll position, hover, or edit slots. Build the
    // static frame once when the tab is activated; on subsequent renders
    // updateSnmpInPlace() touches only the cells that actually change.
    if (state.activeTab === "snmp") {
        if (state.lastRenderedTab !== "snmp") {
            root.innerHTML = renderSnmp();
            wireSnmpControls();
            state.lastRenderedTab = "snmp";
        }
        updateSnmpInPlace();
        wireTables();
        return;
    }
    state.lastRenderedTab = state.activeTab;
    if (state.activeTab === "overview")   root.innerHTML = renderOverview();
    if (state.activeTab === "interfaces") root.innerHTML = renderInterfaces();
    if (state.activeTab === "flows")      root.innerHTML = renderFlows();
    if (state.activeTab === "setup")      root.innerHTML = renderSetup();
    if (state.activeTab === "overview")   { wireOverviewControls(); drawTimeseries(); }
    if (state.activeTab === "interfaces") wireInterfaceTable();
    if (state.activeTab === "flows")      wireFlowsControls();
    wireTables();
}

function drawTimeseries() {
    const c = document.getElementById("ts-canvas");
    if (!c) return;
    const ctx = c.getContext("2d");
    // Adapt to actual displayed width
    const cw = c.clientWidth, ch = c.clientHeight;
    if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
    ctx.clearRect(0, 0, cw, ch);
    if (!state.timeseries) return;   // canvas already cleared above

    const css = getComputedStyle(document.documentElement);
    const cssVar = (name) => css.getPropertyValue(name).trim();
    const gridColor    = cssVar("--line");
    const axisColor    = cssVar("--text-faint");
    const ingressColor = cssVar("--accent");
    const egressColor  = cssVar("--accent-2");
    const ingressFill  = cssVar("--chart-ingress-fill");
    const egressFill   = cssVar("--chart-egress-fill");

    const ing = state.timeseries.ingress;
    const eg  = state.timeseries.egress;
    const n   = ing.length;
    const max = Math.max(1, ...ing, ...eg);

    // grid
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
        const y = (ch / 4) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
    }
    // y-axis labels
    ctx.fillStyle = axisColor;
    ctx.font = "10px JetBrains Mono";
    ctx.textAlign = "right";
    ctx.fillText(bytesHuman(max) + "/s",        cw - 4, 12);
    ctx.fillText(bytesHuman(max/2) + "/s",      cw - 4, ch/2 + 4);
    ctx.fillText("0",                            cw - 4, ch - 4);

    function plot(data, color, fillColor) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            const x = (i / (n - 1)) * cw;
            const y = ch - (data[i] / max) * (ch - 16) - 4;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        // fill
        ctx.lineTo(cw, ch); ctx.lineTo(0, ch); ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();
        // line
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
            const x = (i / (n - 1)) * cw;
            const y = ch - (data[i] / max) * (ch - 16) - 4;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
    plot(ing, ingressColor, ingressFill);
    if (eg.some(v => v > 0)) plot(eg, egressColor, egressFill);
}

        const lbl = d ? exporterDisplayName(d) : state.selectedExporter;
        chips.push(`<span class="filter-chip">EXPORTER: ${escapeHtml(lbl)}
            <span class="x" data-clear="exporter">×</span></span>`);
    }
    if (state.ifindexFilter != null) {
        chips.push(`<span class="filter-chip">IFINDEX: ${escapeHtml(state.ifindexFilter)}

    }

    if (!state.flows.length) {
        return `
        <div class="panel">

    // Interface name lookup so the In/Out columns can show the SNMP-resolved

        { key: "ts", label: "Time",

        { key: "exporter", label: "Exporter",
          render: r => `<td class="dim">${escapeHtml(r.exporter)}</td>` },
        { key: "src", label: "Src → Dst", value: r => r.src + " → " + r.dst,
          render: r => `<td>
              ${endpointHtml(r.src_ip, r.src_host, r.src_port)}
              <span class="dim"> → </span>
              ${endpointHtml(r.dst_ip, r.dst_host, r.dst_port)}
          </td>` },
        { key: "protocol_name", label: "Proto",
          render: r => `<td class="proto">${escapeHtml(r.protocol_name || "")}</td>` },
        { key: "in_if_disp", label: "In if", cls: "num",
          value: r => r.in_if_disp,
          render: r => `<td class="num ingress">${escapeHtml(r.in_if_disp)}</td>` },
        { key: "out_if_disp", label: "Out if", cls: "num",
          value: r => r.out_if_disp,
          render: r => `<td class="num egress">${escapeHtml(r.out_if_disp)}</td>` },
        { key: "bytes", label: "Bytes", cls: "num",
          render: r => `<td class="num">${bytesHuman(r.bytes)}</td>` },
        { key: "packets", label: "Packets", cls: "num",
          render: r => `<td class="num dim">${numHuman(r.packets)}</td>` },
    ], rows, { defaultSort: "ts", defaultDir: -1 });

    return `
        <div class="panel">
            <div class="panel-head">
                <span class="accent">▸</span> Live Flow Records
                <span class="meta">${chips.join("") || `${rows.length} most recent`}</span>
            </div>

        </div>
    `;
