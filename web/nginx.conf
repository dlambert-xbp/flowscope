server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: all unmatched routes return index.html so client-side
    # routing works on hard refresh. (No router yet, but this is
    # the right shape from day one.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy api + observability endpoints to the Go service in the
    # same docker-compose network. Same-origin from the browser's
    # perspective, no CORS dance.
    location /api/     { proxy_pass http://api:8080; }
    location /healthz  { proxy_pass http://api:8080; }
    location /metrics  { proxy_pass http://api:8080; }
}
