# FlowScope local development stack.
#
# Brings up ClickHouse with persistent storage and the Go ingest
# service. As more services land (api, alert, snmp, gnmi, web), they
# extend this file.
#
# The Python-era stack lives on the `v1` branch.

services:

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: flowscope-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native TCP
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    environment:
      # CLICKHOUSE_DB creates the database via SQL at first boot.
      # User/password come from the mounted users.d/flowscope.xml —
      # do NOT set CLICKHOUSE_USER here or the entrypoint will try to
      # write users.d/default-user.xml, which our :ro mount forbids.
      CLICKHOUSE_DB: flowscope
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot bootstrap. Applies forward-only schema migrations, then
  # reads flow_retention_days / counter_retention_days from app_settings
  # and emits ALTER TABLE ... MODIFY TTL. Exits 0 on success. api +
  # ingest gate on this service completing successfully so they never
  # take traffic against a half-migrated schema or a stale TTL.
  init:
    build:
      context: .
      dockerfile: cmd/init/Dockerfile
    image: flowscope-init:latest
    container_name: flowscope-init
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_LOG_LEVEL: "info"
    mem_limit: 128m
    cpus: 0.25

  ingest:
    build:
      context: .
      dockerfile: cmd/ingest/Dockerfile
    image: flowscope-ingest:latest
    container_name: flowscope-ingest
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "2055:2055/udp"   # NetFlow v5/v9/IPFIX
      - "6343:6343/udp"   # sFlow v5
      - "9100:9100/tcp"   # Prometheus /metrics
    environment:
      FLOWSCOPE_NETFLOW_ADDR: ":2055"
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_LOG_LEVEL: "info"
    mem_limit: 1g
    cpus: 1.0

  snmp:
    build:
      context: .
      dockerfile: cmd/snmp/Dockerfile
    image: flowscope-snmp:latest
    container_name: flowscope-snmp
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "9102:9102/tcp"   # Prometheus /metrics
    environment:
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_SNMP_INTERVAL: "15m"
      # Cluster-wide v2c fallback. Per-exporter v2c / v3 bindings
      # configured via Settings → SNMP credentials override this.
      FLOWSCOPE_SNMP_COMMUNITY: "elastiflow"
      FLOWSCOPE_SNMP_WORKERS: "8"
      # AES-256-GCM master key for per-exporter credential storage.
      # Resolved through internal/secrets:
      #   env:VAR       — plaintext from env var (legacy / dev only)
      #   file:/path    — read file contents (compose default below)
      #   kv:https://…  — Azure Key Vault via Workload Identity
      # MUST resolve to the same value on api + alert + snmp services.
      # Generate the dev value with: openssl rand -base64 32 > ./secrets/snmp_master
      FLOWSCOPE_SNMP_KEY_REF: "file:/run/secrets/snmp_master"
      # Real gosnmp client. Set "1" only when there is no network
      # reachable from the container (returns deterministic synthetic
      # inventory keyed by exporter address).
      FLOWSCOPE_SNMP_MOCK: "0"
      FLOWSCOPE_METRICS_ADDR: ":9102"
      FLOWSCOPE_LOG_LEVEL: "info"
    secrets:
      - snmp_master
    mem_limit: 256m
    cpus: 0.5

  alert:
    build:
      context: .
      dockerfile: cmd/alert/Dockerfile
    image: flowscope-alert:latest
    container_name: flowscope-alert
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "9101:9101/tcp"   # Prometheus /metrics
    environment:
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_ALERT_TICK: "10s"
      FLOWSCOPE_METRICS_ADDR: ":9101"
      # Webhook dispatcher needs the same master key as snmp + api to
      # decrypt endpoint secret_ct. Mount via the same file: ref.
      FLOWSCOPE_SNMP_KEY_REF: "file:/run/secrets/snmp_master"
      FLOWSCOPE_LOG_LEVEL: "info"
    secrets:
      - snmp_master
    mem_limit: 256m
    cpus: 0.25

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    image: flowscope-api:latest
    container_name: flowscope-api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8080:8080/tcp"   # HTTP — JSON API + placeholder live HTML at /
    environment:
      FLOWSCOPE_HTTP_ADDR: ":8080"
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      # MUST resolve to the same master as the snmp + alert services;
      # the api uses it to encrypt/decrypt credentials posted to
      # /api/snmp/credentials and to seal webhook + OIDC secrets.
      FLOWSCOPE_SNMP_KEY_REF: "file:/run/secrets/snmp_master"
      FLOWSCOPE_LOG_LEVEL: "info"
    secrets:
      - snmp_master
    mem_limit: 512m
    cpus: 0.5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: flowscope-web:latest
    container_name: flowscope-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80/tcp"   # React SPA via nginx; /api/* proxied to api:8080
    mem_limit: 256m
    cpus: 0.25

volumes:
  clickhouse-data:
  clickhouse-logs:

# Top-level docker secrets. The snmp_master file holds the AES-256-GCM
# master key used by internal/snmpx to derive per-record keys via
# HKDF-SHA256 (see VISION.md §4.2). It is mounted read-only at
# /run/secrets/snmp_master inside snmp, alert, and api containers.
#
# Operator steps (first-time setup):
#   cp ./secrets/snmp_master.example ./secrets/snmp_master
#   # then replace the example content with: openssl rand -base64 32
#
# The real ./secrets/snmp_master file is gitignored — do NOT commit it.
# Production deployments should resolve the master from Azure Key Vault
# via Workload Identity (see deploy/helm/flowscope/values.yaml).
secrets:
  snmp_master:
    file: ./secrets/snmp_master
