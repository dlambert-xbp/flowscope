services:
  flowscope:
    build: .
    image: flowscope:latest
    container_name: flowscope
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"     # web dashboard
      - "2055:2055/udp"     # NetFlow v5/v9/IPFIX
      - "6343:6343/udp"     # sFlow v5
    volumes:
      - flowscope-data:/data
    # Cap the container slightly below the host VM (4 vCPU / 16 GiB) so
    # the host keeps headroom for sshd / journald / docker itself.
    # mem_limit / cpus are honored by plain `docker compose up` on every
    # engine; `deploy.resources.limits` is Swarm-only, so we use the
    # non-Swarm form for reliability.
    mem_limit: 14g
    cpus: 3.5

volumes:
  flowscope-data:
