# FlowScope local development stack.
#
# Brings up ClickHouse with persistent storage and the Go ingest
# service. As more services land (api, alert, snmp, gnmi, web), they
# extend this file.
#
# The Python-era stack lives on the `v1` branch.

services:

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: flowscope-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native TCP
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    environment:
      # CLICKHOUSE_DB creates the database via SQL at first boot.
      # User/password come from the mounted users.d/flowscope.xml —
      # do NOT set CLICKHOUSE_USER here or the entrypoint will try to
      # write users.d/default-user.xml, which our :ro mount forbids.
      CLICKHOUSE_DB: flowscope
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ingest:
    build:
      context: .
      dockerfile: cmd/ingest/Dockerfile
    image: flowscope-ingest:latest
    container_name: flowscope-ingest
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "2055:2055/udp"   # NetFlow v5/v9/IPFIX
      - "6343:6343/udp"   # sFlow v5
      - "9100:9100/tcp"   # Prometheus /metrics
    environment:
      FLOWSCOPE_NETFLOW_ADDR: ":2055"
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_LOG_LEVEL: "info"
    mem_limit: 1g
    cpus: 1.0

  alert:
    build:
      context: .
      dockerfile: cmd/alert/Dockerfile
    image: flowscope-alert:latest
    container_name: flowscope-alert
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "9101:9101/tcp"   # Prometheus /metrics
    environment:
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_ALERT_TICK: "10s"
      FLOWSCOPE_METRICS_ADDR: ":9101"
      FLOWSCOPE_LOG_LEVEL: "info"
    mem_limit: 256m
    cpus: 0.25

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    image: flowscope-api:latest
    container_name: flowscope-api
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080/tcp"   # HTTP — JSON API + placeholder live HTML at /
    environment:
      FLOWSCOPE_HTTP_ADDR: ":8080"
      FLOWSCOPE_CLICKHOUSE_DSN: "clickhouse://flowscope:flowscope@clickhouse:9000/flowscope"
      FLOWSCOPE_LOG_LEVEL: "info"
    mem_limit: 512m
    cpus: 0.5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: flowscope-web:latest
    container_name: flowscope-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80/tcp"   # React SPA via nginx; /api/* proxied to api:8080
    mem_limit: 256m
    cpus: 0.25

volumes:
  clickhouse-data:
  clickhouse-logs:
