apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowscope.fullname" . }}-api
  labels:
    {{- include "flowscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "flowscope.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "flowscope.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- if and (eq .Values.secrets.backend "kv") .Values.secrets.workloadIdentity.enabled }}
        # Required pod label for the Azure Workload Identity mutating
        # webhook to inject AZURE_* env vars + the projected token.
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "flowscope.serviceAccountName" . }}
      # Block on schema migrations + retention TTL applying. The
      # init container reads flow_retention_days /
      # counter_retention_days from app_settings and emits ALTER
      # TABLE ... MODIFY TTL before api starts serving.
      initContainers:
        {{- include "flowscope.initContainer" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.api.image.repository }}:{{ default .Values.image.tag .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FLOWSCOPE_CLICKHOUSE_DSN
              value: {{ .Values.global.clickhouseDSN | quote }}
            - name: FLOWSCOPE_LOG_LEVEL
              value: {{ .Values.global.logLevel | quote }}
            # Point the Overview tab's ingest panel at the in-cluster
            # ingest Service. The Go default is the docker-compose
            # hostname; here we derive from the chart's release name
            # so a non-default release name still resolves.
            - name: FLOWSCOPE_INGEST_HEALTH_URL
              value: "http://{{ include "flowscope.fullname" . }}-ingest:9100/health/ingest"
            {{- include "flowscope.snmpKeyEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with (include "flowscope.snmpKeyVolumeMount" . | trim) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with (include "flowscope.snmpKeyVolume" . | trim) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowscope.fullname" . }}-api
  labels:
    {{- include "flowscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "flowscope.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
