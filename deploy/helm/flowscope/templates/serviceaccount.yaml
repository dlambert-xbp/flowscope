{{- /*
ServiceAccount for snmp / alert / api pods that load the SNMP master
key. Created only when:
  - secrets.backend=kv (Workload Identity needs a dedicated SA so the
    federated credential mapping can target it by name), or
  - serviceAccount.create=true (explicit override; useful if the
    operator wants IRSA / SPIFFE wired in via custom annotations).

Workload Identity on AKS expects two annotations on the SA:
  azure.workload.identity/client-id: <managed identity client ID>
  azure.workload.identity/tenant-id: <Azure tenant ID>
and a label `azure.workload.identity/use: "true"` on the pod template.
The chart stamps the label on consumer deployments below.

The federated credential itself (the trust between AAD and the K8s
SA's projected token issuer) must be provisioned out of band by the
operator via `az identity federated-credential create` — see the PR
runbook section.
*/ -}}
{{- if or (eq .Values.secrets.backend "kv") .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flowscope.serviceAccountName" . }}
  labels:
    {{- include "flowscope.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and (eq .Values.secrets.backend "kv") .Values.secrets.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ .Values.secrets.workloadIdentity.clientID | quote }}
    {{- if .Values.secrets.workloadIdentity.tenantID }}
    azure.workload.identity/tenant-id: {{ .Values.secrets.workloadIdentity.tenantID | quote }}
    {{- end }}
    {{- end }}
{{- end }}
