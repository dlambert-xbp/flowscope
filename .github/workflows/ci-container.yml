# Container CI — build (+ sign + push on main / tag) for every cmd/<svc>
# that ships a Dockerfile today.
#
# Services with Dockerfiles on disk: alert, api, ingest, init, snmp.
# (`cmd/synth` is a test tool; `cmd/gnmi` doesn't exist yet — when its
# Dockerfile lands, add it to the matrix here.)
#
# PR runs: build-only, no push, no signing. Keeps PR latency low and
# avoids tokens leaking via fork PRs.
#
# main / tag pushes: build + push to GHCR + cosign keyless via OIDC.
# Cosign requires `id-token: write` — scoped to this workflow only.

name: ci-container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  # id-token: write is only needed for cosign keyless on push events.
  # It's safe to declare at the workflow level — fork PRs do not get
  # this token from GitHub regardless of what we write here.
  id-token: write
  # packages: write is needed to push to ghcr.io; pull-only on PR.
  packages: write

concurrency:
  group: ci-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with cmd/*/Dockerfile on disk. Adding
        # a new service binary means adding it here + a Helm template
        # entry (CLAUDE.md "Adding a new Go binary" rule).
        service: [alert, api, ingest, init, snmp]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/flowscope-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Compute push flag
        id: pushflag
        # Push only on push to main or tag pushes — never on PRs (incl.
        # forks). Keeps PR builds offline-safe.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.pushflag.outputs.push == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build (and push on main/tag)
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: cmd/${{ matrix.service }}/Dockerfile
          push: ${{ steps.pushflag.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # provenance=mode=max gives a verifiable SLSA build attestation
          # the cosign step below can sign over.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install cosign
        if: steps.pushflag.outputs.push == 'true'
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      - name: Sign image (keyless, OIDC)
        if: steps.pushflag.outputs.push == 'true'
        env:
          COSIGN_EXPERIMENTAL: '1'
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # `cosign sign --yes` skips the interactive y/N prompt. Identity
        # is fetched from the GitHub OIDC token, so no long-lived signing
        # key lives in secrets.
        run: |
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"
