# Web E2E (Playwright) — real gate.
#
# Brings up the docker-compose stack, waits for the api to be ready,
# and runs the Playwright smoke suite. See TASKS.md #18 and
# web/playwright/README.md for scope and how to run locally.
#
# Pin third-party actions to commit SHAs (project convention from
# PR #39, see ci-go.yml / ci-web.yml). Tag comments next to each pin.

name: ci-e2e-playwright

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright (compose stack)
    runs-on: ubuntu-latest
    # COMPOSE_FILE layers the CI override on top of the base compose
    # file for every `docker compose` invocation in this job. The
    # override flips FLOWSCOPE_SNMP_MOCK=1 on the snmp service so the
    # Devices tab has rows once synth has been run.
    env:
      COMPOSE_FILE: docker-compose.yml:deploy/ci/docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # 22 is the current LTS line. ci-web.yml uses 20 — leaving
          # this on 22 lets us test the runtime newer browsers expect
          # without churning the unit-test workflow.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright browsers
        # Browser tarballs are ~300MB; caching them shaves a minute or
        # two off each run. Keyed on the playwright version so a bump
        # invalidates correctly.
        id: pw-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Set up Docker Buildx
        # Enables BuildKit for `docker compose build`. Cross-run GHA
        # layer caching would require `cache_from`/`cache_to` in the
        # compose file (or a bake migration) — not done here. BuildKit
        # still gives better within-job layer reuse than the legacy
        # builder, which is worth the ~3-second setup cost.
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        # If the cache restored, this is a no-op (Playwright detects
        # the existing install). `--with-deps` installs the OS
        # packages Chromium needs on a fresh Ubuntu runner — required
        # for the `ms-playwright` cache to be useful (cache only
        # carries the browser binary, not the apt deps).
        run: npx playwright install --with-deps chromium

      - name: Bootstrap secrets
        # `make bootstrap-secrets` creates ./secrets/snmp_master,
        # which docker-compose.yml bind-mounts into snmp/alert/api.
        # Without this, `docker compose up` fails with a missing-
        # bind-source error before any container starts.
        run: make bootstrap-secrets

      - name: Build compose images
        # Build with BuildKit enabled (set up above) so multi-stage
        # Go builds get GHA layer caching. Building in a separate step
        # makes the next step's "up" fast and isolates build failures
        # from runtime ones in the job log.
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_DOCKER_CLI_BUILD: '1'
        run: docker compose build

      - name: Start compose stack
        run: docker compose up -d

      - name: Wait for api to be healthy
        # Bounded retry on /api/health/ingest. 90s gives ClickHouse +
        # the schema-migration init container time to settle on a cold
        # runner. The api proxies /api/health/ingest to the ingest
        # service; once that returns 2xx, every backend's wired up.
        #
        # On timeout we dump the last 200 lines of every container's
        # logs into the job output so a CI operator can debug without
        # needing the artifact upload. The artifact uploads still
        # run via the "always()" gate further down.
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl -fsS http://localhost/api/health/ingest >/dev/null 2>&1; then
              echo "api healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::api did not become healthy within 90s"
          echo "----- docker compose ps -----"
          docker compose ps
          echo "----- docker compose logs (tail 200) -----"
          docker compose logs --tail 200 || true
          exit 1

      - name: Set up Go for synth
        # cmd/synth needs the Go toolchain. cache: false because we're
        # only `go run`ning one short-lived command; the cache setup
        # cost would outweigh any download savings.
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'
          cache: false

      - name: Seed flows + counter samples
        # 15 seconds of synthetic NetFlow v5 + sFlow v5 traffic against
        # ingest's host-mapped UDP ports gives the Devices tab rows
        # (via exporter_health) and lets the walk-now regression canary
        # actually click a button instead of skipping on empty state.
        #
        # The combined FLOWSCOPE_SNMP_MOCK=1 (from the CI compose
        # override) lets the snmp service produce deterministic device
        # inventory for the same exporter set so the Devices feature
        # pane has more than just an IP.
        run: |
          go run ./cmd/synth \
            --target 127.0.0.1:2055 --rate 5000 \
            --sflow-target 127.0.0.1:6343 --sflow-rate 2000 \
            --duration 15s

      - name: Wait for ingest + snmp scheduler to settle
        # The api batcher flushes on N records OR T ms; 5s is well
        # above the slowest flush. The snmp scheduler ticks every 60s,
        # so we don't try to wait for it here — the Neighbors empty
        # state path in Playwright covers the no-walk-yet case.
        run: sleep 5

      - name: Run Playwright
        working-directory: web
        # CI=true is the standard signal Playwright reads to enable
        # CI-friendly defaults (retries=1 per playwright.config.ts).
        env:
          CI: 'true'
        run: npm run e2e

      - name: Dump compose logs on failure
        # `always()` ensures this runs even when an earlier step
        # failed. The log file feeds the upload step below.
        if: always()
        run: |
          mkdir -p /tmp/e2e-artifacts
          docker compose logs --tail 500 > /tmp/e2e-artifacts/compose-logs.txt 2>&1 || true
          docker compose ps > /tmp/e2e-artifacts/compose-ps.txt 2>&1 || true

      - name: Upload Playwright report
        # `if-no-files-found: ignore` keeps green runs from failing
        # the upload when there's nothing to report.
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces / screenshots
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: compose-logs
          path: /tmp/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down compose stack
        # `-v` drops the named volumes too — fresh ClickHouse state
        # for the next run. always() so we clean up even on failure.
        if: always()
        run: docker compose down -v
